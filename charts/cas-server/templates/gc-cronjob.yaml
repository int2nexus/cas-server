{{- include "cas-server.validateStorage" . }}
{{- include "cas-server.validateAuth" . }}
{{- if .Values.gc.enabled }}
{{- /*
  GC CronJob 은 하나 또는 둘이다.

  단계별 비용이 3~4자릿수 다르다(usage.md "단계를 나눠 실행하기" 참고). orphan 스캔만
  blobs 전량을 훑어 규모를 따라가고, 나머지 둘은 인덱스가 덮는다. fullSweep 을 켜면
  주 CronJob 에서 비싼 단계를 빼고 별도 주기로 돌릴 수 있다.

  fullSweep 이 꺼져 있고 gc.phases 가 비어 있으면 CronJob 하나가 전 단계를 돈다 —
  이 값들이 없던 때와 같은 동작이다.
*/}}
{{- /*
  gc.phases 검증. 잘못된 값은 여기서 막는다 — 통과시키면 CronJob 이 처음 도는 새벽에야
  드러난다. 공백도 제거한다: "multipart, purge" 처럼 쓰면 URL 에 raw 공백이 들어가
  curl 이 URL 자체를 거부하고(exit 3) Job 은 "HTTP 000" 으로 죽는데, 그 메시지로는
  값이 문제라는 것을 알 수 없다.
*/}}
{{- $phases := nospace (default "" .Values.gc.phases) }}
{{- if $phases }}
{{- range $p := splitList "," $phases }}
{{- if not (has $p (list "multipart" "orphan" "purge")) }}
{{- fail (printf "gc.phases 에 알 수 없는 단계 %q 가 있습니다. multipart, orphan, purge 중에서 고르십시오 (예: \"multipart,purge\"). 비워 두면 세 단계 모두 실행합니다." $p) }}
{{- end }}
{{- end }}
{{- end }}
{{- /*
  orphan 이 어느 Job 에서도 돌지 않는 조합을 막는다.
  전에는 매 실행 경고만 남겼는데, 로그 보존 창이 짧은 환경에서 경고 한 줄은 없는 것과 같다.
  그리고 오타(`orphn`)는 렌더가 거부하는데 의미상 더 위험한 이 조합은 통과해서, 가드가
  일관되지 않았다(2026-08-21 고객 리포트 §2-3).
  "성공했는데 아무 일도 안 한 상태" 가 가장 비싼 실패다 — 회수가 영영 돌지 않는다.
*/}}
{{- if and $phases (not (contains "orphan" $phases)) (not .Values.gc.fullSweep.enabled) }}
{{- fail "gc.phases 에서 orphan 을 빼면 gc.fullSweep.enabled 를 켜야 합니다. 둘 다 아니면 참조가 사라진 blob 이 회수되지 않고 계속 쌓입니다. 회수를 아예 돌리지 않으실 의도라면 gc.enabled: false 로 두십시오." }}
{{- end }}
{{- $jobs := list (dict "suffix" "" "schedule" .Values.gc.schedule "phases" $phases "deadline" .Values.gc.activeDeadlineSeconds) }}
{{- if .Values.gc.fullSweep.enabled }}
{{- $jobs = append $jobs (dict "suffix" "-full" "schedule" .Values.gc.fullSweep.schedule "phases" "" "deadline" (default .Values.gc.activeDeadlineSeconds .Values.gc.fullSweep.activeDeadlineSeconds)) }}
{{- end }}
{{- range $job := $jobs }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "cas-server.fullname" $ }}-gc{{ $job.suffix }}
  labels:
    {{- include "cas-server.labels" $ | nindent 4 }}
spec:
  schedule: {{ $job.schedule | quote }}
  # 이전 GC Job이 아직 실행 중이면 새 Job을 시작하지 않음.
  # GC가 겹쳐서 실행되는 것을 방지하는 핵심 설정.
  #
  # 주의: 이것은 **같은 CronJob 안에서만** 겹침을 막는다. fullSweep 을 켜 두 CronJob 이
  # 같은 시각에 걸리면 서버가 409(GcAlreadyRunning)로 한쪽을 되돌린다 — 아래 스크립트가
  # 409를 정상 종료로 처리하므로 Job 이 실패로 남지는 않지만, 그 주기의 실행은 건너뛴다.
  # 두 schedule 이 겹치지 않게 잡을 것.
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # Job 실패 시 최대 재시도 횟수
      backoffLimit: 2
      # Job이 이 시간 안에 완료되지 않으면 강제 종료
      activeDeadlineSeconds: {{ $job.deadline }}
      template:
        metadata:
          labels:
            app.kubernetes.io/name: {{ include "cas-server.name" $ }}-gc
            app.kubernetes.io/instance: {{ $.Release.Name }}
        spec:
          # Deployment와 같은 신원을 쓴다. 여기를 빼면 두 워크로드가 서로 다른 SA로
          # 돌아 IRSA/Workload Identity 애노테이션이 한쪽에만 걸린다.
          serviceAccountName: {{ include "cas-server.serviceAccountName" $ }}
          # 이 Job은 GC 엔드포인트를 curl로 치는 것뿐이다. 쿠버네티스 API를 부르지 않는다.
          automountServiceAccountToken: {{ $.Values.serviceAccount.automountToken }}
          restartPolicy: OnFailure
          containers:
          - name: gc-trigger
            image: "{{ $.Values.gc.image.repository }}:{{ $.Values.gc.image.tag }}"
            imagePullPolicy: {{ $.Values.gc.image.pullPolicy }}
            command:
            - sh
            - -c
            - |
              set -u
              BASE="http://{{ include "cas-server.fullname" $ }}:{{ $.Values.service.port }}"
              POLL_INTERVAL=10
              # activeDeadlineSeconds보다 조금 일찍 끝내, k8s SIGKILL 전에 타임아웃 로그를 남긴다.
              MAX_WAIT={{ $job.deadline }}
              [ "$MAX_WAIT" -gt 60 ] && MAX_WAIT=$((MAX_WAIT - 60))

              # 인증 헤더를 positional params에 저장 (공백 보존).
              #
              # Secret 에 auth-gc-token 이 있으면 그것을, 없으면 admin 토큰을 쓴다.
              # 둘 다 비면 헤더를 붙이지 않는다. values 쪽 스위치를 두지 않는 이유는 두 키가
              # optional 참조라 **Secret 에 값이 있는지가 그대로 스위치**이기 때문이다 —
              # 스위치를 따로 두면 그 둘이 어긋날 수 있다.
              #
              # ADMIN_TOKEN 폴백은 폐기 예정이다 — 이미지 0.1.24 에서 제거되면 이 Job 은
              # auth-gc-token 없이는 401 이 된다. 그 전에 그 키를 채울 것.
              TOKEN="${GC_TOKEN:-${ADMIN_TOKEN:-}}"
              if [ -n "$TOKEN" ]; then
                set -- -H "Authorization: Bearer ${TOKEN}"
              else
                set --
              fi

              # 1) 트리거 전 마지막 ran_at 기록 (이번 실행 완료 감지 기준)
              prev=$(curl -sS --max-time 30 "$@" "$BASE/_api/gc/last-result" | grep -o '"ran_at":"[^"]*"' || true)
              echo "이전 ran_at: ${prev:-<none>}"

              # 2) GC 트리거 — 서버는 백그라운드로 실행하고 202를 즉시 반환한다.
              echo "돌 단계: {{ $job.phases | default "전체" }}"
              code=$(curl -sS --max-time 30 -o /tmp/resp -w '%{http_code}' -X POST "$@" "$BASE/_internal/gc?dry_run=false{{ if $job.phases }}&phases={{ $job.phases }}{{ end }}")
              echo "트리거 응답: $code $(cat /tmp/resp 2>/dev/null)"
              if [ "$code" = "409" ]; then echo "이미 GC 실행 중 — 스킵"; exit 0; fi
              # 401은 자격증명 문제다 — 비었든 틀렸든 회전 뒤 어긋났든 여기서 잡힌다.
              if [ "$code" = "401" ]; then echo "인증 실패 — Secret 의 auth-gc-token / auth-admin-token 을 확인하십시오"; exit 1; fi
              # 400은 phases 값이 서버가 모르는 이름이라는 뜻이다. 서버가 조용히 넘기지
              # 않으므로 여기서도 실패로 남긴다 — 오타 하나로 의도한 단계가 빠진 채
              # 성공으로 보이면 회수가 멈춘 것을 아무도 모른다.
              if [ "$code" = "400" ]; then echo "phases 값이 거절됨 — values 의 gc.phases 확인"; exit 1; fi
              if [ "$code" != "202" ] && [ "$code" != "200" ]; then echo "GC 트리거 실패 (HTTP $code)"; exit 1; fi

              # 3) last-result의 ran_at이 바뀔 때까지(=이번 GC 완료) 폴링
              elapsed=0
              while [ "$elapsed" -lt "$MAX_WAIT" ]; do
                sleep "$POLL_INTERVAL"; elapsed=$((elapsed + POLL_INTERVAL))
                body=$(curl -sS --max-time 30 "$@" "$BASE/_api/gc/last-result" || true)
                cur=$(printf '%s' "$body" | grep -o '"ran_at":"[^"]*"' || true)
                if [ -n "$cur" ] && [ "$cur" != "$prev" ]; then
                  status=$(printf '%s' "$body" | grep -o '"status":"[^"]*"' | cut -d'"' -f4)
                  echo "GC 완료: $body"
                  if [ "$status" = "failed" ]; then echo "GC 실행이 실패로 기록됨"; exit 1; fi
                  exit 0
                fi
              done
              echo "GC 완료 대기 타임아웃 (${MAX_WAIT}s)"; exit 1
            # 둘 다 optional 이다. 키가 없으면 unset 이 되고 위 스크립트가 넘어간다.
            env:
            # 폐기 예정 — 이미지 0.1.24 에서 제거 시 이 블록도 함께 지운다.
            - name: ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "cas-server.fullname" $ }}
                  key: auth-admin-token
                  optional: true
            - name: GC_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "cas-server.fullname" $ }}
                  key: auth-gc-token
                  optional: true
            resources:
              requests:
                cpu: "10m"
                memory: "16Mi"
              limits:
                cpu: "100m"
                memory: "64Mi"
{{- end }}
{{- end }}
