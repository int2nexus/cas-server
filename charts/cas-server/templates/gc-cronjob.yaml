{{- include "cas-server.validateStorage" . }}
{{- include "cas-server.validateAuth" . }}
{{- if .Values.gc.enabled }}
{{- /*
  GC CronJob 은 하나 또는 둘이다.

  네 단계 중 sweep 만 blobs 전량을 훑어 규모를 따라간다. 기본값은 CronJob 하나가 넷을
  다 도는 것이고, fullSweep 을 켜면 sweep 만 별도 주기로 뗄 수 있다.
*/}}
{{- /*
  gc.phases 검증. 잘못된 값은 여기서 막는다 — 통과시키면 CronJob 이 처음 도는 새벽에야
  드러난다. 공백도 제거한다: "multipart, purge" 처럼 쓰면 URL 에 raw 공백이 들어가
  curl 이 URL 자체를 거부하고(exit 3) Job 은 "HTTP 000" 으로 죽는데, 그 메시지로는
  값이 문제라는 것을 알 수 없다.
*/}}
{{- $phases := nospace (default "" .Values.gc.phases) }}
{{- if $phases }}
{{- range $p := splitList "," $phases }}
{{- if not (has $p (list "multipart" "orphan" "purge" "sweep")) }}
{{- fail (printf "gc.phases 에 알 수 없는 단계 %q 가 있습니다. multipart, orphan, purge, sweep 중에서 고르십시오 (예: \"multipart,purge\"). 비워 두면 sweep 을 뺀 셋을 실행합니다." $p) }}
{{- end }}
{{- end }}
{{- end }}
{{- /*
  회수 단계 둘을 각각 지키는 가드다. 경고가 아니라 렌더 거부인 이유는 로그 보존 창이
  짧은 환경에서 경고 한 줄이 없는 것과 같기 때문이다(2026-08-21 고객 리포트 §2-3 이
  요청한 형태). 두 단계를 나눈 이유는 CHANGELOG 0.1.32 에 있다.
*/}}
{{- /* 가드 1 — `orphan` 이 어느 Job 에서도 돌지 않는 조합. */}}
{{- if and $phases (not (has "orphan" (splitList "," $phases))) }}
{{- fail "gc.phases 에 orphan 이 없습니다. 이 이미지부터 회수 후보 큐를 확인하는 단계가 orphan 이고, 큐를 비우는 경로가 그것뿐입니다 — 빼면 회수가 돌지 않을 뿐 아니라 후보가 삭제 1 건당 1 행씩 계속 쌓입니다. gc.fullSweep 은 대신이 되지 않습니다(그쪽은 sweep 만 돕니다). 회수를 아예 돌리지 않으실 의도라면 gc.enabled: false 로 두십시오." }}
{{- end }}
{{- /*
  가드 2 — `sweep` 이 어느 Job 에서도 돌지 않는 조합. 기본값(빈 gc.phases)에 sweep 이
  없으므로 fullSweep 을 켜지 않으면 전량 스캔이 사라진다.

  fullSweep 을 기본으로 켜지 않는 이유: 이 스캔은 무겁고 도는 시각이 결정적이라,
  기본으로 켜면 아무도 고르지 않은 시각에 생긴다(2026-08-31 고객 리포트 §3-1).
*/}}
{{- if and (not .Values.gc.fullSweep.enabled) (not (and $phases (has "sweep" (splitList "," $phases)))) }}
{{- fail "gc.fullSweep.enabled 를 켜거나 gc.phases 에 sweep 을 넣으십시오. 이 이미지부터 orphan 은 회수 후보 큐만 확인하므로, sweep(blobs 전량 스캔)이 어디에서도 돌지 않으면 후보 등록이 빠진 blob 을 찾아낼 경로가 없어 조용히 쌓입니다. fullSweep 의 schedule 은 기본값을 그대로 쓰지 마시고 백업·덤프 일정과 겹치지 않는 시각으로 정하십시오 — UTC 로 해석됩니다." }}
{{- end }}
{{- $jobs := list (dict "suffix" "" "schedule" .Values.gc.schedule "phases" $phases "deadline" .Values.gc.activeDeadlineSeconds) }}
{{- if .Values.gc.fullSweep.enabled }}
{{- /*
  `sweep` 만 넘긴다. 빈 값을 넘기면 `orphan` 이 여기서도 돌아 큐를 비우는 주기가
  월간이 된다.
*/}}
{{- $jobs = append $jobs (dict "suffix" "-full" "schedule" .Values.gc.fullSweep.schedule "phases" "sweep" "deadline" (default .Values.gc.activeDeadlineSeconds .Values.gc.fullSweep.activeDeadlineSeconds)) }}
{{- end }}
{{- range $job := $jobs }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "cas-server.fullname" $ }}-gc{{ $job.suffix }}
  labels:
    {{- include "cas-server.labels" $ | nindent 4 }}
spec:
  schedule: {{ $job.schedule | quote }}
  # 이전 GC Job이 아직 실행 중이면 새 Job을 시작하지 않음.
  # GC가 겹쳐서 실행되는 것을 방지하는 핵심 설정.
  #
  # 주의: 이것은 **같은 CronJob 안에서만** 겹침을 막는다. fullSweep 을 켜 두 CronJob 이
  # 같은 시각에 걸리면 서버가 409(GcAlreadyRunning)로 한쪽을 되돌린다 — 아래 스크립트가
  # 409를 정상 종료로 처리하므로 Job 이 실패로 남지는 않지만, 그 주기의 실행은 건너뛴다.
  # 두 schedule 이 겹치지 않게 잡을 것.
  #
  # 409 를 정상 종료로 읽어도 되는 것은 재시도가 없기 때문이다(아래 `backoffLimit`).
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # 재시도하지 않는다. 재시도가 다시 트리거하면 시한 초과가 「Job 은 성공인데 GC 는
      # 아직 돈다」 또는 「전량 스캔이 한 번 더 시작된다」로 끝난다(CHANGELOG 0.1.32).
      # `restartPolicy: Never` 와 함께여야 한다 — `OnFailure` 는 kubelet 이 컨테이너를
      # 다시 띄워 이 값과 무관하게 스크립트가 처음부터 돈다.
      backoffLimit: 0
      # 재시도가 없으므로 이 예산은 한 번의 실행만 덮는다.
      activeDeadlineSeconds: {{ $job.deadline }}
      template:
        metadata:
          labels:
            app.kubernetes.io/name: {{ include "cas-server.name" $ }}-gc
            app.kubernetes.io/instance: {{ $.Release.Name }}
        spec:
          # Deployment와 같은 신원을 쓴다. 여기를 빼면 두 워크로드가 서로 다른 SA로
          # 돌아 IRSA/Workload Identity 애노테이션이 한쪽에만 걸린다.
          serviceAccountName: {{ include "cas-server.serviceAccountName" $ }}
          # 이 Job은 GC 엔드포인트를 curl로 치는 것뿐이다. 쿠버네티스 API를 부르지 않는다.
          automountServiceAccountToken: {{ $.Values.serviceAccount.automountToken }}
          # 위 backoffLimit 참고. OnFailure 로 두면 재시작이 막히지 않는다.
          restartPolicy: Never
          containers:
          - name: gc-trigger
            image: "{{ $.Values.gc.image.repository }}:{{ $.Values.gc.image.tag }}"
            imagePullPolicy: {{ $.Values.gc.image.pullPolicy }}
            command:
            - sh
            - -c
            - |
              set -u
              BASE="http://{{ include "cas-server.fullname" $ }}:{{ $.Values.service.port }}"
              POLL_INTERVAL=10
              # activeDeadlineSeconds보다 조금 일찍 끝내, k8s SIGKILL 전에 타임아웃 로그를 남긴다.
              MAX_WAIT={{ $job.deadline }}
              [ "$MAX_WAIT" -gt 60 ] && MAX_WAIT=$((MAX_WAIT - 60))

              # 인증 헤더를 positional params에 저장 (공백 보존).
              #
              # Secret 에 auth-gc-token 이 있으면 그것을 쓰고, 없으면 헤더를 붙이지 않는다.
              # values 쪽 스위치를 두지 않는 이유는 그 키가 optional 참조라 **Secret 에 값이
              # 있는지가 그대로 스위치**이기 때문이다 — 스위치를 따로 두면 둘이 어긋난다.
              #
              # 폐기된 admin 토큰으로 폴백하지 않는다. HTTP 결과가 달라지지는 않는다 —
              # 받는 토큰이 하나도 없으면 게이트는 실어 온 값을 보지 않는다. 죽은
              # 자격증명을 매 실행마다 보내지 않으려는 것이다.
              TOKEN="${GC_TOKEN:-}"
              if [ -n "$TOKEN" ]; then
                set -- -H "Authorization: Bearer ${TOKEN}"
              else
                set --
              fi

              # 1) 트리거 전 마지막 실행의 id 기록 (이번 실행을 가려내는 기준)
              #
              # **`ran_at` 이 아니라 `id` 다.** 서버는 시작 시점에 행을 INSERT 하고 완료
              # 시점에 같은 행을 UPDATE 하므로 `ran_at` 은 시작 값으로 남는다 — 그 값이
              # 바뀐 것은 「끝났다」가 아니라 「시작됐다」를 뜻한다. `id` 는 새 실행에서만
              # 바뀐다.
              prev_id=$(curl -sS --max-time 30 "$@" "$BASE/_api/gc/last-result" | grep -o '"id":[0-9]*' | head -1 || true)
              echo "이전 실행: ${prev_id:-<none>}"

              # 2) GC 트리거 — 서버는 백그라운드로 실행하고 202를 즉시 반환한다.
              #
              # gc.phases 가 비면 아래 curl 이 phases 파라미터를 아예 붙이지 않고, 서버가
              # 자기 기본값(sweep 을 뺀 셋)을 쓴다. 차트 기본값은 sweep 까지 넷이라 그
              # 경우 이 자리에 그 넷이 그대로 찍힌다 — 두 기본값이 다르므로 어느 쪽인지
              # 로그에서 갈라 읽을 수 있어야 한다.
              echo "돌 단계: {{ $job.phases | default "multipart,orphan,purge (phases 미지정 — 서버 기본값이라 sweep 없음)" }}"
              code=$(curl -sS --max-time 30 -o /tmp/resp -w '%{http_code}' -X POST "$@" "$BASE/_internal/gc?dry_run=false{{ if $job.phases }}&phases={{ $job.phases }}{{ end }}")
              echo "트리거 응답: $code $(cat /tmp/resp 2>/dev/null)"
              if [ "$code" = "409" ]; then echo "이미 GC 실행 중 — 스킵"; exit 0; fi
              # 401은 자격증명 문제다 — 비었든 틀렸든 회전 뒤 어긋났든 여기서 잡힌다.
              if [ "$code" = "401" ]; then echo "인증 실패 — Secret 의 auth-gc-token 을 확인하십시오"; exit 1; fi
              # 400은 phases 값이 서버가 모르는 이름이라는 뜻이다. 서버가 조용히 넘기지
              # 않으므로 여기서도 실패로 남긴다 — 오타 하나로 의도한 단계가 빠진 채
              # 성공으로 보이면 회수가 멈춘 것을 아무도 모른다.
              if [ "$code" = "400" ]; then echo "phases 값이 거절됨 — values 의 gc.phases 확인"; exit 1; fi
              if [ "$code" != "202" ] && [ "$code" != "200" ]; then echo "GC 트리거 실패 (HTTP $code)"; exit 1; fi

              # 3) 새 실행이 **끝날 때까지** 폴링한다.
              #
              # 조건이 둘이다 — `id` 가 바뀌었고(내 트리거가 만든 실행이다), `status` 가
              # 더 이상 `running` 이 아니다(그 실행이 끝났다). 앞엣것만 보면 시작 시점의
              # 스냅샷을 완료로 읽고 나가 버린다. 그러면 아래 셋이 전부 무너진다.
              #
              #   - 로그에 남는 본문이 **시작 시점 값**이다 — `deleted_blobs: 0` 이
              #     「회수할 것이 없었다」로 읽힌다
              #   - `ms_*` 가 아직 비어 있다
              #   - `failed` 분기가 죽는다 — 실패가 기록되기 전에 Job 이 이미 나갔다
              elapsed=0
              while [ "$elapsed" -lt "$MAX_WAIT" ]; do
                sleep "$POLL_INTERVAL"; elapsed=$((elapsed + POLL_INTERVAL))
                body=$(curl -sS --max-time 30 "$@" "$BASE/_api/gc/last-result" || true)
                cur_id=$(printf '%s' "$body" | grep -o '"id":[0-9]*' | head -1 || true)
                [ -n "$cur_id" ] || continue
                [ "$cur_id" != "$prev_id" ] || continue
                status=$(printf '%s' "$body" | grep -o '"status":"[^"]*"' | cut -d'"' -f4)
                # 아직 도는 중이면 계속 기다린다. 타임아웃까지 안 끝나면 아래에서 실패다.
                [ "$status" != "running" ] || continue
                echo "GC 완료: $body"
                if [ "$status" = "failed" ]; then echo "GC 실행이 실패로 기록됨"; exit 1; fi
                exit 0
              done
              # 새 실행이 보이지 않았거나 `running` 인 채로 시간이 다 갔다. 둘 다 실패다.
              echo "GC 완료 대기 타임아웃 (${MAX_WAIT}s) — 마지막 응답: ${body:-<none>}"; exit 1
            # optional 이다. 키가 없으면 unset 이 되고 위 스크립트가 헤더를 붙이지 않는다.
            env:
            - name: GC_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "cas-server.fullname" $ }}
                  key: auth-gc-token
                  optional: true
            resources:
              requests:
                cpu: "10m"
                memory: "16Mi"
              limits:
                cpu: "100m"
                memory: "64Mi"
{{- end }}
{{- end }}
