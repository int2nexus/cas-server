{{- include "cas-server.validateStorage" . }}
{{- include "cas-server.validateAuth" . }}
{{- if not .Values.secrets.useExternalSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cas-server.fullname" . }}
  labels:
    {{- include "cas-server.labels" . | nindent 4 }}
type: Opaque
# stringData: Kubernetes가 자동으로 base64 인코딩 처리
stringData:
  db-password: {{ .Values.secrets.dbPassword | quote }}
  {{- if eq .Values.storage.mode "s3" }}
  s3-access-key-id: {{ .Values.secrets.s3AccessKeyId | quote }}
  s3-secret-access-key: {{ .Values.secrets.s3SecretAccessKey | quote }}
  {{- end }}
  auth-secret-master-key: {{ .Values.secrets.secretMasterKey | quote }}
  # 폐기 예정 — 이미지 0.1.24 에서 제거 시 이 줄도 함께 지운다.
  auth-admin-token: {{ .Values.secrets.adminToken | quote }}
  {{- with .Values.auth.metricsToken }}
  auth-metrics-token: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.gcToken }}
  auth-gc-token: {{ . | quote }}
  {{- end }}
  auth-root-access-key-id: {{ .Values.secrets.rootAccessKeyId | quote }}
  auth-root-secret-key: {{ .Values.secrets.rootSecretKey | quote }}
{{- end }}
