{{- include "cas-server.validateStorage" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cas-server.fullname" . }}
  labels:
    {{- include "cas-server.labels" . | nindent 4 }}
data:
  # Deployment에서 /app/config/default.toml 로 마운트됨
  # db_url 은 여기에 포함하지 않음 — Secret 기반 환경변수 CAS__DB_URL 로 주입
  default.toml: |
    # int64 필수: Helm은 큰 수를 float64로 다뤄 지수 표기(1.073741824e+10)로 렌더링한다.
    # TOML에서 그것은 정수가 아니라 실수이며, 2의 거듭제곱이 아닌 값은 반올림된다.
    port                    = {{ .Values.config.port }}
    max_upload_size_bytes   = {{ .Values.config.maxUploadSizeBytes | int64 }}
    inline_hash_limit_bytes = {{ .Values.config.inlineHashLimitBytes | int64 }}
    gc_interval_secs        = {{ .Values.config.gcIntervalSecs }}
    soft_delete_retention_secs = {{ .Values.config.softDeleteRetentionSecs | int64 }}
    db_max_connections      = {{ .Values.config.dbMaxConnections }}
    db_min_connections      = {{ .Values.config.dbMinConnections }}
    db_acquire_timeout_secs = {{ .Values.config.dbAcquireTimeoutSecs }}
    request_timeout_secs    = {{ .Values.config.requestTimeoutSecs }}
    presigned_redirect_secs = {{ .Values.config.presignedRedirectSecs }}

    # 업로드 상한. cas-server 이미지 0.1.16 이상에서만 동작한다(차트 버전 아님).
    # 미설정 시 서버 기본값 0 = 무제한.
    # 값은 기동 로그에 항상 기록되므로 적용 여부를 거기서 확인할 수 있다.
    {{- with .Values.config.maxUploadBytesInFlight }}
    max_upload_bytes_in_flight = {{ . | int64 }}
    {{- end }}
    {{- with .Values.config.maxConcurrentUploads }}
    max_concurrent_uploads     = {{ . | int64 }}
    {{- end }}
    {{- with .Values.config.gcDbMaxConnections }}
    gc_db_max_connections      = {{ . | int64 }}
    {{- end }}

    # GC 전용 DB 풀의 statement_timeout. cas-server 이미지 0.1.18 이상에서만 동작한다.
    # 미설정 시 서버 기본값 0 = 걸지 않음(기존 동작).
    {{- with .Values.config.gcStatementTimeoutSecs }}
    gc_statement_timeout_secs  = {{ . | int64 }}
    {{- end }}

    # 집계 조회 전용 DB 풀. cas-server 이미지 0.1.18 이상에서만 동작한다.
    # with 를 쓰지 않는다 — 0 은 "타임아웃 없음"이라는 유효한 선택이고, with 는 0 을
    # 건너뛰어 서버 기본값 30 이 적용되므로 의도와 반대가 된다.
    stats_statement_timeout_secs = {{ .Values.config.statsStatementTimeoutSecs | int64 }}
    {{- with .Values.config.statsWorkMemMb }}
    stats_work_mem_mb            = {{ . | int64 }}
    {{- end }}

    # 미완료 멀티파트 만료 기준. cas-server 이미지 0.1.20 이상에서만 동작한다.
    # with 를 쓰지 않는다 — 0 도 유효한 시험 값이고, with 는 0 을 건너뛰어 서버
    # 기본값 86400 이 적용되므로 의도와 반대가 된다.
    multipart_ttl_secs           = {{ required "config.multipartTtlSecs 가 null 입니다. 값을 주거나 키를 지우십시오(지우면 차트 기본값 86400 이 적용됩니다). null 이면 0 이 렌더돼 진행 중인 업로드의 파트가 조립 전에 회수됩니다." .Values.config.multipartTtlSecs | int64 }}

    # 웹 콘솔(/_ui, /_api/*). cas-server 이미지 0.1.20 이상에서만 동작한다.
    # 그 이하 이미지는 이 키를 무시하고 항상 마운트한다.
    console_enabled              = {{ required "config.consoleEnabled 가 null 입니다. true/false 를 주거나 키를 지우십시오(지우면 차트 기본값 true 가 적용됩니다). null 이면 빈 값이 렌더돼 TOML 파싱이 실패하고 파드가 기동하지 못합니다." .Values.config.consoleEnabled }}

    {{- if eq .Values.storage.mode "nfs" }}
    {{- range .Values.storage.nfs.backends }}

    [[storage_backends]]
    id         = {{ .id | quote }}
    name       = {{ .name | quote }}
    mount_path = {{ .mountPath | quote }}
    {{- end }}
    {{- end }}

    {{- if eq .Values.storage.mode "s3" }}

    [[storage_backends]]
    id         = "s3-default"
    name       = "s3"
    type       = "s3"
    endpoint   = {{ .Values.storage.s3.endpoint | quote }}
    bucket     = {{ .Values.storage.s3.bucket | quote }}
    allow_http = {{ .Values.storage.s3.allowHttp }}
    {{- if .Values.storage.s3.region }}
    region     = {{ .Values.storage.s3.region | quote }}
    {{- end }}
    {{- if .Values.storage.s3.keyPrefix }}
    key_prefix = {{ .Values.storage.s3.keyPrefix | quote }}
    {{- end }}
    # access_key_id / secret_access_key 는 AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY
    # 환경변수로 주입 (object_store crate가 AWS 표준 자격증명 체인을 통해 읽음)
    {{- end }}
