{{- include "cas-server.validateStorage" . }}
{{- include "cas-server.validateAuth" . }}
{{- include "cas-server.validateProbeBudget" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cas-server.fullname" . }}
  labels:
    {{- include "cas-server.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    {{- toYaml .Values.updateStrategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "cas-server.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cas-server.selectorLabels" . | nindent 8 }}
      annotations:
        # ConfigMap 변경 시 Pod 자동 재시작을 위한 체크섬
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if not .Values.secrets.useExternalSecret }}
        # 차트가 Secret을 만드는 경우에만 유효하다. useExternalSecret: true(기본값)면
        # secret.yaml 이 렌더링되지 않아 이 값이 상수가 되므로 아예 달지 않는다 —
        # 상수 체크섬은 "변경을 감지한다"는 착각만 준다.
        #
        # 외부 Secret(sealed-secret)을 갱신했을 때는 Helm 이 그 내용을 볼 수 없으므로
        # 파드가 자동 재시작되지 않는다. `kubectl rollout restart deploy/<name>` 이
        # 필요하다 — README 의 "메트릭 스크레이프" 절에 적어 두었다.
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
    spec:
      # 0.1.23까지 values.yaml에 serviceAccount 블록이 있었으나 어떤 템플릿도 참조하지
      # 않아 설정해도 조용히 무시됐다. 보안 인접 노브에서 가장 나쁜 실패 형태다.
      serviceAccountName: {{ include "cas-server.serviceAccountName" . }}
      # 이 서버는 쿠버네티스 API를 부르지 않는다. 마운트된 토큰은 컨테이너가 뚫렸을 때
      # 그대로 API 접근 수단이 되므로 기본값을 false로 둔다. IRSA/Workload Identity를
      # 쓰는 경우에만 true가 필요하다.
      automountServiceAccountToken: {{ .Values.serviceAccount.automountToken }}
      # graceful shutdown 여유. 값을 렌더링하지 않아 쿠버네티스 기본값 30초가
      # 적용되고 있었다 — values.yaml 설정이 조용히 무시되던 자리다.
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      # ── Init Containers ───────────────────────────────────────────────────
      initContainers:
        # PostgreSQL이 준비될 때까지 대기
        # 앱 자체가 시작 시 CREATE TABLE IF NOT EXISTS를 실행하므로
        # DB 접속만 확인하면 됨 (별도 스키마 Job 불필요)
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for PostgreSQL at {{ include "cas-server.dbHost" . }}:{{ include "cas-server.dbPort" . }}..."
              until nc -z {{ include "cas-server.dbHost" . }} {{ include "cas-server.dbPort" . }}; do
                echo "PostgreSQL not ready, retrying in 2s..."
                sleep 2
              done
              echo "PostgreSQL is ready."

        {{- if eq .Values.storage.mode "nfs" }}
        # NFS 마운트가 활성화되었는지 확인
        # LocalFsBlobStore 는 시작 시 각 마운트 경로에 create_dir_all 을 호출하므로
        # 경로가 존재하고 쓰기 가능해야 함
        - name: wait-for-nfs
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              {{- range .Values.storage.nfs.backends }}
              echo "Checking NFS mount {{ .mountPath }}..."
              until [ -d {{ .mountPath }} ]; do
                echo "{{ .mountPath }} not available, retrying in 2s..."
                sleep 2
              done
              echo "{{ .mountPath }} is ready."
              {{- end }}
          volumeMounts:
            {{- range .Values.storage.nfs.backends }}
            - name: nas-{{ .id }}
              mountPath: {{ .mountPath }}
            {{- end }}
        {{- end }}

      # ── Main Container ────────────────────────────────────────────────────
      containers:
        - name: cas-server
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- /*
            digest 가 있으면 그것으로 핀한다. 태그는 같은 이름으로 다시 밀릴 수 있어
            "지금 무엇을 돌리고 있는가" 를 확정하지 못한다. digest 는 내용 주소라
            그 문제가 없다. 값은 각 버전의 CHANGELOG 에 함께 싣는다.
          */}}
          image: "{{ .Values.image.repository }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ else }}:{{ .Values.image.tag }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.config.port }}
              protocol: TCP

          # ── 환경변수 ────────────────────────────────────────────────────
          env:
            # Secret에서 DB 비밀번호를 먼저 로드
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "cas-server.fullname" . }}
                  key: db-password
            # CAS__DB_URL: $(DB_PASSWORD)는 Kubernetes가 위 env var 값으로 확장
            - name: CAS__DB_URL
              value: "postgresql://{{ include "cas-server.dbUser" . }}:$(DB_PASSWORD)@{{ include "cas-server.dbHost" . }}:{{ include "cas-server.dbPort" . }}/{{ include "cas-server.dbName" . }}"

            {{- if eq .Values.storage.mode "s3" }}
            # object_store crate는 AWS 표준 자격증명 체인을 지원:
            # AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY 환경변수를 자동으로 읽음
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "cas-server.fullname" . }}
                  key: s3-access-key-id
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "cas-server.fullname" . }}
                  key: s3-secret-access-key
            {{- end }}

            # CAS__AUTH__* 환경변수: Secret에서 주입. 빈 값이면 서버가 NoAuth 모드로 동작.
            - name: CAS__AUTH__SECRET_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "cas-server.fullname" . }}
                  key: auth-secret-master-key
            # 폐기된 토큰이다. 주입만 남긴 것은 **값이 아직 남아 있는 배포에 기동 로그로
            # 알리기 위해서**다 — 그 경고를 내려면 값이 서버까지 닿아야 한다.
            #
            # optional 이다. 죽은 키를 지우는 것이 파드 기동 실패가 되면 아무도 지우지
            # 않는다. 키가 없으면 서버는 미설정으로 보고 경고도 뜨지 않는다.
            - name: CAS__AUTH__ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "cas-server.fullname" . }}
                  key: auth-admin-token
                  optional: true
            # GET /_internal/metrics 를 여는 유일한 수단이다.
            #
            # optional: true 가 필수다. 기존 배포의 sealed-secret 은 7개 키만 갖고 있고,
            # 필수로 두면 그 Secret 을 갱신하기 전에는 파드가 CreateContainerConfigError 로
            # 뜨지 못한다 — 업그레이드가 곧 전면 중단이 된다(replicaCount=1).
            # 키가 없으면 환경변수가 설정되지 않고, auth 를 켠 배포에서는 그 경로가 401 이다.
            - name: CAS__AUTH__METRICS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "cas-server.fullname" . }}
                  key: auth-metrics-token
                  optional: true
            # GC(POST /_internal/gc, GET /_api/gc/*) 전용 토큰. 이 토큰으로 /_admin/* 은
            # 열리지 않으므로 GC CronJob 에는 이것을 준다.
            # cas-server 이미지 0.1.21 이상.
            #
            # optional: true 가 필수다 — 이 키가 없는 sealed-secret 에서 파드가 뜨지
            # 못하게 된다. 없으면 auth 를 켠 배포에서 GC 의 bearer 경로가 닫힌다.
            - name: CAS__AUTH__GC_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "cas-server.fullname" . }}
                  key: auth-gc-token
                  optional: true
            - name: CAS__AUTH__ROOT_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "cas-server.fullname" . }}
                  key: auth-root-access-key-id
            - name: CAS__AUTH__ROOT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "cas-server.fullname" . }}
                  key: auth-root-secret-key
            - name: CAS__AUTH__ANONYMOUS_GET
              value: {{ .Values.auth.anonymousGet | quote }}
            # 자격증명 캐시 TTL. 폐기된 키나 좁힌 정책이 실제로 막히기까지의 지연이다.
            - name: CAS__AUTH__CACHE_TTL_SECS
              value: {{ .Values.auth.cacheTtlSecs | quote }}

            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}

          # ── 볼륨 마운트 ─────────────────────────────────────────────────
          volumeMounts:
            # ConfigMap → /app/config/default.toml
            - name: config
              mountPath: /app/config
              readOnly: true

            {{- if eq .Values.storage.mode "nfs" }}
            {{- range .Values.storage.nfs.backends }}
            - name: nas-{{ .id }}
              mountPath: {{ .mountPath }}
            {{- end }}
            {{- end }}

          # ── 헬스체크 ────────────────────────────────────────────────────
          # 프로브별 역할과 엔드포인트 선택 이유는 values.yaml 주석 참고.
          {{- if .Values.startupProbe.enabled }}
          # 기동(DB 마이그레이션 포함)이 끝날 때까지 liveness/readiness를 유예한다.
          startupProbe:
            httpGet:
              path: {{ .Values.startupProbe.httpGet.path }}
              port: {{ .Values.startupProbe.httpGet.port }}
            periodSeconds: {{ .Values.startupProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.startupProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.startupProbe.failureThreshold }}
          {{- end }}
          # GET /_internal/live → 의존성을 보지 않는 프로세스 응답성 확인
          livenessProbe:
            httpGet:
              path: {{ .Values.livenessProbe.httpGet.path }}
              port: {{ .Values.livenessProbe.httpGet.port }}
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
          # GET /_internal/health → DB ping + 백엔드 가용성 검사
          readinessProbe:
            httpGet:
              path: {{ .Values.readinessProbe.httpGet.path }}
              port: {{ .Values.readinessProbe.httpGet.port }}
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}

          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}

      # ── 볼륨 정의 ──────────────────────────────────────────────────────────
      volumes:
        - name: config
          configMap:
            name: {{ include "cas-server.fullname" . }}
            items:
              - key: default.toml
                path: default.toml

        {{- if eq .Values.storage.mode "nfs" }}
        {{- range .Values.storage.nfs.backends }}
        - name: nas-{{ .id }}
          persistentVolumeClaim:
            claimName: {{ include "cas-server.pvcName" (dict "root" $ "backend" .) }}
        {{- end }}
        {{- end }}

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
