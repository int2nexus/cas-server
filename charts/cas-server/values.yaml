# ─────────────────────────────────────────────────────────────────────────────
# cas-server Helm Chart — values.yaml
#
# 배포 환경별 오버라이드는 별도 values-{env}.yaml 파일 사용:
#   helm install cas-server ./charts/cas-server -f values-prod.yaml
#
# ── 문서 ─────────────────────────────────────────────────────────────────────
#   아키텍처 (스토리지 모델·백엔드·API 명세)
#     https://github.com/int2nexus/cas-server/blob/main/charts/cas-server/docs/architecture.md
#   사용법 (배포·키 관리·AWS CLI/boto3 예제)
#     https://github.com/int2nexus/cas-server/blob/main/charts/cas-server/docs/usage.md
#   차트 README
#     https://github.com/int2nexus/cas-server/blob/main/charts/cas-server/README.md
# ─────────────────────────────────────────────────────────────────────────────

# ── 이미지 ────────────────────────────────────────────────────────────────────
image:
  repository: int2jieun/cas-server # Docker Hub에 미리 빌드된 이미지 사용
  # 0.1.17 미만으로 내리려면 livenessProbe/startupProbe의 path를
  # /_internal/health로 함께 되돌릴 것 — 아래 프로브 섹션 주석 참고.
  #
  # 0.1.18 미만으로 내리면 두 가지가 사라진다:
  #  - 해시별 쓰기 락 테이블의 즉시 회수. GC 실행 시에만 회수되므로,
  #    gc.enabled: false 배포에서는 유휴 바닥값이 상승한다 (gc 섹션 주석 참고)
  #  - auth.metricsToken. 그 토큰으로 스크레이프하면 401 이 된다
  tag: "0.1.19"
  pullPolicy: IfNotPresent

imagePullSecrets: []

# 리소스 이름 오버라이드. 둘 다 비우면 이름은 "{릴리스명}-cas-server" 가 된다
# (릴리스명에 "cas-server" 가 들어 있으면 릴리스명만 쓴다).
#
#   nameOverride     — 차트 이름 부분만 바꾼다
#   fullnameOverride — 전체 이름을 그대로 대체한다
#
# Service·Secret·ConfigMap·Deployment 이름이 모두 이 값을 따르므로,
# sealed-secret 의 metadata.name 도 함께 맞춰야 한다.
nameOverride: ""
fullnameOverride: ""

# 1을 유지할 것. 늘리면 데이터 유실 가능성이 생긴다.
#
# GC의 blob 물리 삭제와 진행 중인 PUT 사이의 durability 보호가 **프로세스 내부**
# per-hash 뮤텍스에 의존한다(cas-server `object_store.rs`의 `BlobWriteLocks`).
# 파드가 둘 이상이면 이 락이 공유되지 않아 다음이 가능해진다.
#
#   pod B (PUT): blob 기록 완료, 메타데이터 커밋 직전
#   pod A (GC):  참조가 없다고 판단해 blob 파일을 물리 삭제
#   pod B (PUT): 커밋 → 존재하지 않는 파일을 가리키는 object_versions 행
#
# GC CronJob은 Service로 요청을 보내므로 어느 한 파드에서 실행된다. 레플리카가 1개면
# GC와 모든 PUT이 같은 프로세스라 뮤텍스가 걸려 안전하다.
#
# 처리량이 부족하면 레플리카 대신 파드 리소스를 키울 것.
replicaCount: 1

# ── 롤아웃 전략 ───────────────────────────────────────────────────────────────
# Recreate 를 쓴다. 기본값(RollingUpdate)은 replicas=1 에서
# maxSurge=ceil(0.25)=1, maxUnavailable=floor(0.25)=0 이 되어, **모든 업그레이드와
# rollout restart 에서 구·신 파드가 동시에 Ready 상태로 겹친다.**
#
# 그 겹침 창에서 두 프로세스가 서로 다른 per-hash 뮤텍스 맵을 잡는다. 위에서
# replicaCount 를 1로 강제하는 근거가 바로 그 맵의 공유인데, 롤아웃마다 그 근거가
# 깨지는 셈이다. GC 가 다른 파드에서 커밋 직전인 blob 을 참조 없음으로 오판해
# 물리 삭제할 수 있다.
#
# 대가는 롤아웃 중 짧은 중단이다. replicaCount 가 1 이라 노드 재기동만으로도
# 어차피 생기는 중단이고, durability 를 그 대가로 사는 편이 맞다고 봤다.
# 무중단이 더 중요하고 위 위험을 감수하기로 했다면 아래를 RollingUpdate 로 바꾸되,
# **그 결정을 기록으로 남길 것.**
updateStrategy:
  type: Recreate

# ── 앱 설정 (ConfigMap → /app/config/default.toml) ───────────────────────────
config:
  port: 8080
  maxUploadSizeBytes: 10737418240    # 10 GiB
  inlineHashLimitBytes: 268435456   # 256 MiB
  gcIntervalSecs: 0                 # Pod 자체 GC 비활성화 — gc-cronjob이 단독으로 트리거

  # soft-delete 된 object_versions **행**의 보존 기간 (초). 용도는 테이블 팽창 관리다.
  #
  # **실수 삭제의 되돌림 창이 아니다.** blob 물리 삭제는 GC 의 orphan 정리가 하고 이 값과
  # 무관하므로, 올려도 파일은 돌아오지 않는다. 되돌림 창은 다음 GC 실행까지다 —
  # README 의 "삭제와 되돌림 창" 참고.
  softDeleteRetentionSecs: 604800
  # DB 커넥션 풀. 파드당 총 사용량은 dbMaxConnections + gcDbMaxConnections + 1(집계 전용)이다.
  # 지켜야 할 부등식: replicaCount × (dbMaxConnections + gcDbMaxConnections + 1) < PG max_connections
  # 기본값 기준 1 × (20 + 2 + 1) = 23.
  #
  # 커넥션은 **요청당이 아니라 쿼리당** 잡힌다. PUT 은 백엔드에 물리 쓰기를 하는 동안
  # 커넥션을 쥐지 않는다. 다만 그것만으로 maxConcurrentUploads 와의 대소 관계가
  # 정당화되지는 않는다 — 아래 maxConcurrentUploads 주석 참고(판정 보류).
  dbMaxConnections: 20
  dbMinConnections: 2               # 항상 유지할 유휴 커넥션. 0이면 뜸한 뒤 첫 요청이 접속 핸드셰이크 비용을 문다(실측 68ms → 0.5ms)
  dbAcquireTimeoutSecs: 10          # DB 커넥션 획득 타임아웃 (초) — 부하 시 빠른 실패 선호. 아래 readinessProbe.timeoutSeconds 와 함께 움직인다
  requestTimeoutSecs: 120           # 요청 처리 타임아웃 (초). 0=비활성화. 느린 S3 백엔드까지 포함한 요청 경로의 유일한 wall-clock 상한이다
  presignedRedirectSecs: 0          # GET presigned redirect URL 유효 시간 (초). 0=비활성화. S3 엔드포인트가 클라이언트에서 직접 접근 가능한 경우에만 활성화

  # ── GC 쿼리 타임아웃 (cas-server 이미지 0.1.18 이상 필요) ────────────────────
  # GC 전용 DB 풀에만 statement_timeout 을 건다. 0 = 걸지 않음(기존 동작).
  #
  # 이 값만이 **PostgreSQL 이 실제로 문장을 취소**하게 한다. requestTimeoutSecs 와
  # dbAcquireTimeoutSecs 는 "기다리기를 포기"하는 것이고 쿼리는 DB 에서 계속 돈다.
  # 실행 계획이 틀어져 임시 파일을 대량으로 뱉기 시작하면 애플리케이션 재시작으로도
  # 끊지 못하고 DBA 가 pg_terminate_backend() 를 쏘아야 한다.
  #
  # 요청 경로 풀에는 적용되지 않는다 — 대용량 업로드의 메타데이터 커밋을 죽이면
  # 정상 업로드가 실패한다. GC 는 배치라 잘려도 다음 주기에 재시도한다.
  #
  # 값 정하는 법: **고정 배수로 두지 말 것.** GC 소요는 blobs 규모에 따라 빠르게 늘어나
  # 어떤 배수도 몇 주면 소진될 수 있고, 정상 실행을 죽이면 GC 가 영구히 완주하지 못한다.
  # 매주 gc_runs 의 소요를 보고 갱신할 것 — gc-cronjob 의 Job 실행 시간이나
  # /_api/gc/last-result 로 확인한다.
  #
  # 잘린 **실제** 실행은 gc_runs 에 status=failed 로 남는다(집계값은 0으로 기록되어
  # 부분 진행분은 이력에 보이지 않는다). 단 dry_run=true 실행은 성공·실패 어느 쪽도
  # gc_runs 에 남지 않고 파드 로그에만 남는다.
  gcStatementTimeoutSecs: 0

  # ── 집계 조회 전용 풀 (cas-server 이미지 0.1.18 이상 필요) ───────────────────
  # 집계 조회(/_api/stats, /_api/buckets, /_api/buckets/{bucket}/objects 의 서브폴더
  # 조회, /_api/backends 의 blob 집계, orphan 카운트)의 쿼리 상한.
  # 이 조회들은 커넥션 1개짜리 별도 풀에서 돌아 요청 경로와 격리되므로, 여기에 타임아웃을
  # 걸어도 업로드는 영향받지 않는다. 0 = 걸지 않음(권장하지 않음).
  # 격리가 필요한 이유는 README 의 "집계 조회 격리" 참고.
  statsStatementTimeoutSecs: 30
  # 집계 풀의 work_mem (MiB). 0 = 서버 값을 그대로 쓴다.
  # **PostgreSQL 쪽 메모리**를 쓴다 — 파드가 아니다. 노드당·워커당 할당량이므로 PG
  # 사이징을 확인한 뒤 조정할 것. 올리면 해시 조인 스필이 준다.
  statsWorkMemMb: 0

  # ── 업로드 상한 (cas-server 이미지 0.1.16 이상 필요. image.tag 확인할 것) ───────────────────────────────────────
  # 2026-08-05 운영 OOM의 마지막 방어선이다. 상한을 넘는 업로드는 503 SlowDown +
  # Retry-After 로 거절한다 — 프로세스가 OOMKilled 되는 것보다 낫다.
  #
  # 주의: 0 = 무제한이다. 명시하지 않으면 걸리지 않는다.
  # 주의: maxUploadBytesInFlight 는 resources.limits.memory 와 함께 움직여야 한다.
  #       한도를 내리면 이 값도 같이 내릴 것. 기준: limits.memory × 0.5
  maxUploadBytesInFlight: 3221225472  # 3 GiB  (아래 resources.limits.memory 6Gi 기준)
  # 건수 상한. 보조 장치 — 실제 방어는 위 바이트 예산이 한다.
  #
  # 이 값과 dbMaxConnections(20)의 대소 관계는 **현재 판정 보류다.**
  #
  # 커넥션이 요청당이 아니라 쿼리당 잡히는 것은 맞다. 다만 메타데이터 커밋의 점유
  # 시간에는 상한이 없고(요청 경로 풀에는 statement_timeout 을 걸지 않는다), 96 에
  # 닿은 관측도 아직 없다. 그래서 "서로 다른 자원이라 맞출 필요 없다"고 단정하지 않는다.
  #
  # 판정에는 적재 중 두 지표의 동시 표본이 필요하다.
  #   cas_upload_in_flight          (동시 업로드 건수)
  #   cas_db_pool_idle_connections  (유휴 커넥션)
  # in_flight 가 높은데 idle > 0 이 유지되면 커넥션은 병목이 아니다.
  # in_flight 가 96 에 훨씬 못 미치는데 idle == 0 이 지속되면 커넥션이 먼저 소진되는
  # 것이므로, 리미터를 내리는 것이 아니라 dbMaxConnections 를 올리는 쪽이 맞다.
  #
  # 참고: cas_upload_rejected_total 은 이 건수 상한과 위 바이트 예산의 거절을
  # **함께** 센다. 0이면 둘 다 한 번도 안 걸렸다는 뜻이다.
  maxConcurrentUploads: 96

  # GC 전용 DB 풀 크기. 배치라 작아도 된다. 위 dbMaxConnections 의 부등식에 함께 들어간다.
  # 주의: 0 을 넣으면 ConfigMap 에서 생략되어 서버 기본값 2 가 적용된다(0 으로 못 내린다).
  gcDbMaxConnections: 2

# ── 스토리지 백엔드 ────────────────────────────────────────────────────────────
storage:
  # "s3" 또는 "nfs". 대소문자를 구분한다 — 잘못된 값은 렌더 시점에 fail 로 막는다.
  mode: "s3"

  # NFS 모드: 백엔드를 최소 한 개 정의해야 한다. mode=nfs 인데 비어 있으면 렌더가 실패한다.
  # 빈 목록으로 렌더를 통과시키면 백엔드 0개 ConfigMap 이 만들어지고 서버가 기동 시
  # panic 하는데, replicaCount: 1 + Recreate 조합에서 그것은 전면 장애다.
  nfs:
    backends: []
    # - id: nas1                     # storage_backends[].id — blobs.storage_backend_id 에 기록된다
    #   name: nas1                   # 표시용 이름
    #   mountPath: /mnt/nas1         # 컨테이너 안 마운트 경로
    #   storageClassName: nfs-client # PVC 의 storageClassName
    #   storage: 1Ti                 # PVC 요청 용량
    #   pvcName: ""                  # 비우면 "{fullname}-{id}" 로 자동 생성
    #   accessMode: ReadWriteMany    # PVC accessMode. 생략 시 ReadWriteMany

  # S3 모드: 자격증명은 secrets 섹션에서 Secret으로 주입
  s3:
    endpoint: ""
    bucket: ""        # TODO: 실제 버킷 이름으로 변경
    region: ""        # S3 호환 스토리지의 경우 region은 임의값 가능
    # 비우면 서버가 "cas/" 를 쓴다. 버킷 루트에 쓰는 선택지는 없다.
    # lifecycle 규칙이나 버킷 탐색을 할 때 이 실효 프리픽스를 기준으로 삼을 것
    # (README 의 "오브젝트 스토리지 lifecycle 규칙" 절 참고).
    keyPrefix: ""
    allowHttp: true   # S3 호환 스토리지에서 HTTP 사용 시 true로 설정 (예: MinIO 로컬 배포)      

# ── 외부 DB 접속 정보 ─────────────────────────────────────────────────────────
externalDatabase:
  host: ""
  port: 5432
  username: ""
  database: ""
  # 비밀번호는 secrets.dbPassword 에서 가져옴

# ── 자격증명 ─────────────────────────────────────────────────────────────────
# 아래 7개 시크릿은 useExternalSecret: true(기본값)이면 values.yaml 의 값을 쓰지 않고,
# kubeseal로 암호화한 sealed-secret.yaml을 통해 클러스터에 주입합니다.
#   db-password, s3-access-key-id, s3-secret-access-key
#   auth-secret-master-key, auth-admin-token
#   auth-root-access-key-id, auth-root-secret-key
#
# 선택 항목 1개(있으면 쓰고, 없어도 파드는 정상 기동):
#   auth-metrics-token — 메트릭 읽기 전용 토큰. auth.metricsToken 주석 참고
# kubeseal 로 생성된 Secret 이 클러스터에 이미 존재하므로
# helm 은 Secret 생성을 건너뜁니다.
secrets:
  useExternalSecret: true

  # 아래 값들은 useExternalSecret: false 일 때만 쓰입니다(차트가 Secret 을 만드는 경우).
  # 기본값 true 에서는 무시됩니다 — sealed-secret 에 넣으십시오.
  #
  # 프로덕션 값을 여기에 넣고 커밋하지 마십시오.
  dbPassword: ""
  s3AccessKeyId: ""
  s3SecretAccessKey: ""
  # Admin API 토큰 **문자열**입니다. 아래 auth.adminToken 은 불리언 게이트로,
  # 여기와 역할이 다릅니다 — auth.adminToken 주석을 읽으십시오.
  adminToken: ""
  # 비우면 서버가 NoAuth 모드로 동작합니다(SigV4 검증 없음).
  secretMasterKey: ""
  rootAccessKeyId: ""
  rootSecretKey: ""

# ── 인증 설정 ─────────────────────────────────────────────────────────────────
auth:
  # true 면 GET/HEAD /{bucket}/{key} 를 인증 없이 허용한다 (이미지 서버, FiftyOne 등).
  # ListObjects·ListBuckets 는 제외되므로 보호는 "버킷명과 키를 알아야 읽을 수 있다" 하나다.
  # 노출 범위는 아래 service 절 주의도 함께 볼 것.
  anonymousGet: true

  # **불리언 게이트다. 토큰 값이 아니다.** 실제 토큰 문자열은 sealed-secret(기본) 또는
  # 위 secrets.adminToken(useExternalSecret: false)에 넣는다.
  #
  # 참이면 gc-cronjob 이 Secret 의 auth-admin-token 을 읽어 Authorization 헤더를 붙인다.
  # 서버의 admin 토큰 설정 여부와 **반드시 일치**시킬 것 — 어긋나면 GC 트리거가 401 이다.
  adminToken: true

  # GET /_internal/metrics 전용 읽기 토큰 (cas-server 이미지 0.1.18 이상).
  #
  # 모니터링 스택에는 admin 토큰이 아니라 이것을 쓸 것. admin 토큰은
  # POST /_internal/gc(blob 물리 삭제)와 /_admin/*(액세스 키 관리)까지 여는
  # 자격증명이라, 스크레이프 용도로 배포하면 삭제 권한을 함께 넘기게 된다.
  # 이 토큰은 metrics 엔드포인트에서만 통하고 다른 경로는 열지 않는다.
  #
  # 비워 두면 서버가 admin 토큰으로 폴백한다(기존 배포 동작 유지).
  #
  # 주의: 이 값만 채우고 **admin 토큰을 비우면 서버가 기동을 거부한다.**
  # 그 조합에서는 metrics 만 잠기고 POST /_internal/gc(blob 물리 삭제)가 무인증으로
  # 열려, 401 을 보고 보호된다고 오해하게 되기 때문이다. replicaCount 가 1 이라
  # 기동 실패는 곧 전면 중단이므로, 둘을 함께 설정하거나 이 값을 비워 둘 것.
  #
  # secrets.useExternalSecret: true(기본값)면 이 값은 쓰이지 않는다 —
  # sealed-secret 의 `auth-metrics-token` 키에 넣을 것. 그 키가 없어도
  # 파드는 정상 기동한다(deployment 에서 optional 로 참조한다).
  # 주의: 이 키만 예외적으로 auth.* 아래의 **자격증명 문자열**이다.
  # 나머지 자격증명은 전부 secrets.* 에 있고, auth.adminToken 은 불리언 게이트다.
  metricsToken: ""

  # 자격증명 캐시 TTL (초). 서버 기본값 10.
  #
  # 이것이 **폐기된 액세스 키나 좁힌 정책이 실제로 막히기까지의 지연**이다.
  # 유출 대응 중이라면 0으로 내려 캐시를 끌 것 — 대신 요청마다 DB 조회가 늘어난다.
  cacheTtlSecs: 10

# ── 서비스 ────────────────────────────────────────────────────────────────────
#
# **노출 주의.** /_ui 와 /_api/* 는 /_api/gc/* 셋을 뺀 전부가 무인증이고, 그것을 끄는
# 설정 키가 없다. 경로 단위 이야기다 — /_api/backends 는 무인증이지만 응답 안의 백엔드
# 스토리지 주소(endpoint_url)만은 admin 토큰 뒤에 있다. NodePort 는 **클러스터의 모든 노드 x nodePort** 를 표면으로 만든다 —
# 파드가 없는 노드 IP 에서도 응답한다.
#
# 그 표면에 /_api/stats 같은 전 테이블 집계가 포함된다. 상한(config.statsStatementTimeoutSecs,
# 기본 30초)에 걸리기 전까지는 DB 부하를 만들므로, 아무나 호출할 수 있는 상태를 피할 것.
# 신뢰 네트워크 밖이라면 type: ClusterIP 로 두고 인증 프록시나 NetworkPolicy 뒤에 놓는다.
service:
  type: NodePort
  port: 80
  targetPort: 8080
  nodePort: 30080

# ── Ingress ───────────────────────────────────────────────────────────────────
ingress:
  enabled: false
  className: "nginx"
  annotations:
    # 대용량 파일 업로드 지원 (최대 10 GiB)
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
  host: cas.example.com
  tls: []

# ── 리소스 ────────────────────────────────────────────────────────────────────
# limits.memory 를 바꾸면 config.maxUploadBytesInFlight 도 같이 바꿀 것 (기준 0.5배).
# 한도만 올리고 예산을 그대로 두면 방어선이 실효 없이 낮게 남고, 한도만 내리면
# 예산이 한도를 넘어 상한이 걸리기 전에 OOMKilled 된다.

# 6Gi 는 2026-08-05 OOM 대응으로 올린 값이다. **당분간 6Gi 를 유지할 것.**
#
# 2026-08-11 실환경 관측 결과, 이미지 0.1.16 에서도 유휴 구간 바닥값이 하루
# 330~430 MiB 씩 단조 상승한다(4.9일, 두 세대 컨테이너). 봉우리는 무너지므로
# jemalloc decay 자체는 동작하며, OOMKilled 는 그 기간 0회였다. 즉 0.1.16 은
# "버스트를 반환하는 능력"은 얻었지만 "장기 바닥값 상승"은 남아 있다.
#
# 따라서 아래 단계 하향은 **바닥값 상승이 멈춘 것을 확인한 뒤에만** 한다.
#   6Gi -> 3Gi -> 2Gi, config.maxUploadBytesInFlight 도 한도의 0.5배로 함께 내린다.
#
# 하향 전제 (셋 다 만족해야 함, 최소 7일 연속 관측):
#   1) 유휴 바닥값의 일간 기울기가 0 에 수렴 (아래 판정 쿼리)
#   2) cas_blob_lock_map_entries 가 유휴 구간에 0 으로 떨어질 것.
#      이미지 0.1.18 이상에서 이 값은 "진행 중인 쓰기 건수"이므로 유휴 시 0 이다.
#      0.1.17 이하에서는 "누적 고유 해시 수"이고 GC 실행 시에만 회수된다
#      (gc.enabled 주석 참고)
#   3) container_oom_events_total 이 0 유지
#
# 판정 쿼리:
#   min_over_time(container_memory_working_set_bytes{pod=~"cas-server.*"}[30m])
#   deriv(min_over_time(container_memory_rss{pod=~"cas-server.*"}[6h])[24h:1h])
#
# 위 pod=~ 는 fullname 을 따른다. 릴리스명에 "cas-server" 가 들어 있지 않거나
# fullnameOverride 를 쓰면 아무것도 매치하지 않고 **빈 그래프가 오류 없이** 나온다.
# 그 경우 pod=~"<fullname>.*" 로 바꿀 것.
#
# 바닥값이 계속 오르는 동안에는 한도를 내리는 것이 아니라, 상승률로 한도 도달
# 시점을 계산해 그보다 짧은 주기의 정기 재시작을 두는 것이 맞는 대응이다.
resources:
  requests:
    cpu: "500m"
    memory: "2Gi"
  limits:
    cpu: "2000m"
    memory: "6Gi"

terminationGracePeriodSeconds: 60

# ── 헬스체크 프로브 ───────────────────────────────────────────────────────────
#
# 세 프로브는 서로 다른 질문에 답한다. 같은 엔드포인트를 돌려쓰면 안 된다.
#
#   startupProbe   기동이 끝났는가.        GET /_internal/live
#                  성공할 때까지 liveness/readiness는 평가되지 않는다.
#   livenessProbe  프로세스가 먹통인가.     GET /_internal/live  (의존성을 보지 않음)
#   readinessProbe 지금 서빙 가능한가.      GET /_internal/health (DB ping + 백엔드 가용성)
#
# livenessProbe를 /_internal/health로 두면 안 된다. DB failover(보통 30~120초)나 NAS
# 순간 장애에 파드가 kill되는데, 재시작으로는 외부 의존성이 복구되지 않는다. 오히려
# 재기동 중 initContainer가 DB를 기다리고 CrashLoopBackOff 백오프(최대 5분)가 붙어
# 중단이 원래 장애보다 길어진다. replicaCount가 1이면 그 시간이 곧 전면 중단이다.
#
# /_internal/live 는 appVersion 0.1.17 이상에서만 제공된다.
# 이미지를 0.1.16 이하로 고정해 쓰는 경우 아래 두 path를 /_internal/health로 되돌릴 것
# (그러지 않으면 404가 프로브 실패로 계산되어 파드가 계속 재시작한다).

# 기동이 끝날 때까지 liveness/readiness를 유예한다.
#
# 없으면 "기동 소요 > liveness 예산"인 순간 구조적으로 죽는다. DB 마이그레이션은 HTTP
# 리스너가 열리기 전에 수행되므로 그동안 liveness는 반드시 실패하기 때문이다.
# 실제 사례: object_versions 인덱스를 만드는 마이그레이션이 114초 걸려 liveness
# 예산 90초(= initialDelaySeconds 30 + periodSeconds 30 × (failureThreshold 3 − 1))를
# 넘겨 실패 판정이 확정되었고 파드가 kill되었다(0.1.16 최초 배포).
#
# 예산 = periodSeconds × failureThreshold = 600초.
# 대용량 테이블에 인덱스를 추가하는 마이그레이션이 포함된 릴리스에서는 배포 전에
# `SELECT count(*) FROM object_versions;` 로 소요를 가늠하고 필요하면 늘릴 것.
# 이 예산마저 넘으면 kill → 재시도 → kill 이 반복되어 빠져나오지 못한다.
startupProbe:
  enabled: true
  httpGet:
    path: /_internal/live
    port: 8080
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 60

# initialDelaySeconds는 startupProbe가 켜져 있으면 사실상 의미가 없다(컨테이너 시작
# 시점부터 재는데, startupProbe 성공 시점에는 이미 경과해 있다). startupProbe를 끄는
# 경우를 대비해 남겨 둔다.
livenessProbe:
  httpGet:
    path: /_internal/live
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

# readiness는 의존성을 본다. DB나 백엔드가 죽으면 Service 엔드포인트에서 빠지는 것이
# 맞는 동작이다 — 파드를 죽이지는 않으므로 의존성이 돌아오면 그대로 복귀한다.
#
# **timeoutSeconds 는 config.dbAcquireTimeoutSecs 보다 커야 한다** (기본 12 > 10).
# 이 엔드포인트는 커넥션을 얻지 못하면 그 시간만큼 붙들려 있다가 판정을 내므로, 프로브가
# 먼저 끊기면 이미지 0.1.18 의 포화/단절 구분을 받지 못한다. dbAcquireTimeoutSecs 를
# 올리면 이 값도 함께 올릴 것 — 어긋나면 렌더 시점에 실패한다.
# 배경은 README 의 "readinessProbe.timeoutSeconds 는 ..." 참고.
readinessProbe:
  httpGet:
    path: /_internal/health
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 15
  timeoutSeconds: 12
  failureThreshold: 3

# ── 추가 환경변수 ─────────────────────────────────────────────────────────────
# 표준 CAS__ env var 형태로 추가 설정 주입 가능
extraEnv:
  - name: RUST_LOG
    value: "info"

# ── Pod 보안 컨텍스트 ─────────────────────────────────────────────────────────
podSecurityContext: {}

securityContext: {}

# ── 노드 스케줄링 ─────────────────────────────────────────────────────────────
nodeSelector: {}
tolerations: []
affinity: {}

# ── 서비스 어카운트 ───────────────────────────────────────────────────────────
# Deployment 와 GC CronJob 양쪽에 같은 신원이 적용된다.
serviceAccount:
  # true 면 차트가 ServiceAccount 를 만든다. false 면 기존 것을 쓴다.
  create: false
  # create: true  → 만들 이름 (비우면 fullname)
  # create: false → 쓸 기존 이름 (비우면 네임스페이스의 "default")
  name: ""

  # 토큰 자동 마운트. **기본값 false 다.**
  #
  # 이 서버는 쿠버네티스 API 를 부르지 않는다. 마운트된 토큰은 컨테이너가 뚫렸을 때
  # 그대로 API 접근 수단이 되므로 붙일 이유가 없다. 특히 이 배포는 auth.anonymousGet
  # 이 기본 true 이고 NodePort 로 노출되므로 표면을 늘리지 않는 편이 낫다.
  #
  # true 가 필요한 경우: AWS IRSA, GCP Workload Identity 등 투영 토큰으로 클라우드
  # 자격증명을 받는 구성. 그때는 아래 annotations 도 함께 채운다.
  automountToken: false

  # create: true 일 때 ServiceAccount 에 붙일 애노테이션.
  # IRSA/Workload Identity 를 쓰는 경우 이곳이 그 설정 자리다.
  #   eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/cas-server
  #   iam.gke.io/gcp-service-account: cas-server@project.iam.gserviceaccount.com
  annotations: {}

  # 주의: create: false + name: "" 이면 네임스페이스의 "default" SA 로 돌아가고,
  # 그 SA 는 보통 토큰을 자동 마운트합니다. 즉 **아무것도 설정하지 않은 상태가 더
  # 느슨한 쪽**입니다. 위 automountToken: false 가 파드에 걸리므로 마운트 자체는
  # 막히지만, 전용 SA(create: true)를 두는 편이 권한 경계가 명확합니다.

# ── GC CronJob ────────────────────────────────────────────────────────────────
# Pod 자체 GC(gcIntervalSecs=0)를 끄고 CronJob 한 대만 GC를 트리거.
# concurrencyPolicy: Forbid 로 GC Job이 겹쳐서 실행되지 않도록 보장.
#
# enabled: false 로 두면 CronJob 오브젝트 자체가 생성되지 않는다.
# 초기 마이그레이션 중에는 그렇게 두는 것을 권장한다 — GC 가 orphan 후보마다 해시별
# 쓰기 락을 물리 삭제와 DB 삭제 구간 내내 쥐어 같은 내용을 올리는 PUT 이 대기하고,
# blob 전수 조인이 DB 에 부하를 더한다.
# **적재가 끝나면 다시 켤 것** — 꺼 둔 동안 orphan blob 이 회수되지 않는다.
#
# 주의: cas-server 이미지 0.1.17 **이하**에서는 이 회수 주기가 곧 프로세스 내부
# 해시별 쓰기 락 테이블의 회수 주기다. 항목은 고유 해시마다 하나씩 생기고
# 항목당 약 190~240바이트다.
#
#   enabled: false  → 회수 경로가 아예 없다. 파드 수명 동안 단조 증가
#   enabled: true   → 위 schedule 만큼 쌓였다 비워진다. 주 1회면 최대 일주일치
#
# 즉 **GC 를 켜 뒀다고 해당 없는 항목이 아니다.** 2026-08 운영 건에서 유휴 바닥값이
# 하루 330~430 MiB 상승했고, 주 1회 주기면 그 사이 최대 2.3~2.9 GiB 가 쌓인다.
# 해당 이미지를 쓴다면 적재 기간에 아래를 주기 실행해 완화할 것 —
# blob 물리 삭제도 advisory lock도 없이 그 테이블을 회수한다(admin 토큰 필요):
#
#   POST /_internal/gc?dry_run=true
#
# 함께 도는 것은 읽기 전용 쿼리 둘(orphan 후보 COUNT, 만료 멀티파트 목록)이다.
# 회수는 샤드를 하나씩 잠그고 지나가므로 쓰기 경로 전체를 멈추지는 않는다.
#
# **다만 안전한 쿼리가 아니다.** orphan 후보 COUNT 는 blobs x object_versions 안티조인
# 전수 집계라 데이터가 커지면 디스크로 스필한다. statsStatementTimeoutSecs 는 이 쿼리를
# 덮지 않는다(GC 풀에서 돌기 때문). 위 gcStatementTimeoutSecs 를 함께 켤 것.
#
# 그리고 이 요청은 requestTimeoutSecs(기본 120초)에 걸린다. 그보다 오래 걸리면 408 을
# 받고 **그 시점에도 DB 쪽 쿼리는 계속 돈다.** in-flight 플래그도 거치지 않으므로
# 시간당 cron 으로 돌리면 앞 실행이 안 끝났을 때 겹쳐 쌓인다.
# 주기를 정하기 전에 한 번 수동으로 돌려 소요 시간을 잴 것.
#
# kubectl exec 로는 칠 수 없다 — 런타임 이미지에 curl 도 wget 도 없다.
# 클러스터 안에서 주기 실행하려면 curl 이 있는 이미지의 CronJob 이 필요하고,
# 일회성 확인은 port-forward 후 로컬 curl 로 한다.
#
# 다만 주기 실행이 항상 최선은 아니다. 이 테이블은 프로세스 메모리라 파드 재시작이면
# 통째로 사라지고 단편화까지 함께 회수된다 — 0.1.18 까지의 간격이 짧으면 재시작이 낫다.
# 세 선택지(업그레이드 / 재시작 / 주기 실행)의 판단 기준은
# README 의 "GC와 메모리 회수" 절 참고.
#
# 이미지 0.1.18 이상은 요청이 끝날 때 즉시 회수하므로 이 완화가 필요 없다.
gc:
  enabled: true
  # cron 표현식 — 매주 일요일 새벽 2시 : 0 2 * * 0 — 분 시 일 월 요일(0=일요일).
  schedule: "0 2 * * 0" 
  # Job이 이 시간(초) 안에 완료되지 않으면 강제 종료        
  activeDeadlineSeconds: 7200     # 블롭 많을 수 있으니 2시간으로 여유

  # 이 CronJob 이 돌릴 GC 단계. 쉼표로 구분: multipart, orphan, purge.
  # 빈 값이면 세 단계 모두 — 이 키가 없던 때와 같은 동작이다.
  #
  # 세 단계의 비용이 3~4자릿수 다르다. 실측(blobs 200만 / object_versions 358만):
  #
  #   multipart  무시할 수준   만료된 미완료 멀티파트의 파트 회수
  #   orphan     4,605 ms      참조가 사라진 blob 물리 삭제
  #   purge      0.26 ms       보존 기간 지난 soft-delete 레코드 삭제
  #
  # orphan 만 blobs 전량을 훑으므로 데이터가 늘어나는 만큼 실행 시간이 함께 늘어난다.
  # 나머지 둘은 인덱스로 처리되어 규모의 영향을 받지 않는다.
  #
  # 주간 GC 가 오래 걸린다면 여기서 orphan 을 빼고 아래 fullSweep 으로 옮길 것.
  # 서버가 모르는 이름을 적으면 Job 이 400 으로 실패한다 — 조용히 넘어가지 않는다.
  #
  #   phases: "multipart,purge"
  phases: ""

  # orphan 스캔만 별도 주기로 돌리는 두 번째 CronJob.
  #
  # 위 phases 에서 orphan 을 뺐다면 이것을 켜야 한다. 끄고 빼 두면 회수가 아예
  # 돌지 않아 orphan blob 이 무한히 쌓인다.
  #
  # 이 Job 은 항상 전 단계를 돈다. 두 schedule 이 겹치면 뒤에 걸린 쪽이 409 로
  # 건너뛰어지므로 시각을 벌려 둘 것.
  #
  # schedule 은 데이터 크기가 아니라 **회수 대상이 쌓이는 속도**로 정한다. 스캔 비용은
  # 회수할 blob 이 0건이든 4건이든 같기 때문이다 — O(테이블 크기)이지 O(대상 수)가 아니다.
  #
  # 회수 대상은 마지막 참조가 사라질 때 생긴다(객체 삭제, 같은 키를 다른 내용으로
  # 덮어쓰기). **삭제와 덮어쓰기가 드문 배포라면 자주 훑을 이유가 없다.**
  #
  # GET /_api/gc/history 의 deleted_blobs 로 판단할 것. 매번 한 자릿수면 월 1회나 분기
  # 1회로 늦춘다. 미루는 비용은 (주기당 평균 deleted_blobs) x (평균 blob 크기) x (늘린
  # 배수) 만큼이 디스크에 더 남는 것이다.
  #
  # dry_run=true 로 대상 수를 먼저 세어 보는 것은 이 판단에 쓰지 말 것 — 그 조회도 같은
  # 전수 스캔을 돈다. 지나간 이력을 보는 편이 공짜다.
  fullSweep:
    enabled: false
    # 매월 1일 새벽 3시
    schedule: "0 3 1 * *"
    # 비우면 위 activeDeadlineSeconds 를 그대로 쓴다. 전수 스캔이 주기당 한 번으로
    # 몰리므로 주간보다 길게 잡아야 할 수 있다.
    activeDeadlineSeconds: null
  image:
    repository: curlimages/curl
    tag: "8.7.1"
    pullPolicy: IfNotPresent
