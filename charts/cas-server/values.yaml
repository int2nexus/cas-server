# ─────────────────────────────────────────────────────────────────────────────
# cas-server Helm Chart — values.yaml
#
# 배포 환경별 오버라이드는 별도 values-{env}.yaml 파일 사용:
#   helm install cas-server ./charts/cas-server -f values-prod.yaml
#
# ── 문서 ─────────────────────────────────────────────────────────────────────
#   아키텍처 (스토리지 모델·백엔드·API 명세)
#     https://github.com/int2nexus/cas-server/blob/main/charts/cas-server/docs/architecture.md
#   사용법 (배포·키 관리·AWS CLI/boto3 예제)
#     https://github.com/int2nexus/cas-server/blob/main/charts/cas-server/docs/usage.md
#   차트 README
#     https://github.com/int2nexus/cas-server/blob/main/charts/cas-server/README.md
# ─────────────────────────────────────────────────────────────────────────────

# ── 이미지 ────────────────────────────────────────────────────────────────────
image:
  repository: int2jieun/cas-server # Docker Hub에 미리 빌드된 이미지 사용
  tag: "0.1.16"
  pullPolicy: IfNotPresent

imagePullSecrets: []

replicaCount: 1

# ── 앱 설정 (ConfigMap → /app/config/default.toml) ───────────────────────────
config:
  port: 8080
  maxUploadSizeBytes: 10737418240    # 10 GiB
  inlineHashLimitBytes: 268435456   # 256 MiB
  gcIntervalSecs: 0                 # Pod 자체 GC 비활성화 — gc-cronjob이 단독으로 트리거
  dbMaxConnections: 20              # DB 커넥션 풀 최대 연결 수 (replica 수 × 값이 PG max_connections 미만이어야 함)
  dbAcquireTimeoutSecs: 10          # DB 커넥션 획득 타임아웃 (초) — 부하 시 빠른 실패 선호
  presignedRedirectSecs: 0          # GET presigned redirect URL 유효 시간 (초). 0=비활성화. S3 엔드포인트가 클라이언트에서 직접 접근 가능한 경우에만 활성화

  # ── 업로드 상한 (cas-server 이미지 0.1.16 이상 필요. image.tag 확인할 것) ───────────────────────────────────────
  # 2026-08-05 운영 OOM의 마지막 방어선이다. 상한을 넘는 업로드는 503 SlowDown +
  # Retry-After 로 거절한다 — 프로세스가 OOMKilled 되는 것보다 낫다.
  #
  # 주의: 0 = 무제한이다. 명시하지 않으면 걸리지 않는다.
  # 주의: maxUploadBytesInFlight 는 resources.limits.memory 와 함께 움직여야 한다.
  #       한도를 내리면 이 값도 같이 내릴 것. 기준: limits.memory × 0.5
  maxUploadBytesInFlight: 3221225472  # 3 GiB  (아래 resources.limits.memory 6Gi 기준)
  maxConcurrentUploads: 96            # 건수 상한. 보조 장치 — 실제 방어는 위 바이트 예산이 한다

# ── 스토리지 백엔드 ────────────────────────────────────────────────────────────
storage:
  mode: "s3"
  # S3 모드: 자격증명은 secrets 섹션에서 Secret으로 주입
  s3:
    endpoint: ""
    bucket: ""        # TODO: 실제 버킷 이름으로 변경
    region: ""        # S3 호환 스토리지의 경우 region은 임의값 가능
    keyPrefix: ""
    allowHttp: true   # S3 호환 스토리지에서 HTTP 사용 시 true로 설정 (예: MinIO 로컬 배포)      

# ── 외부 DB 접속 정보 ─────────────────────────────────────────────────────────
externalDatabase:
  host: ""
  port: 5432
  username: ""
  database: ""
  # 비밀번호는 secrets.dbPassword 에서 가져옴

# ── 자격증명 ─────────────────────────────────────────────────────────────────
# 아래 7개 시크릿은 values.yaml에 포함되지 않습니다.
# kubeseal로 암호화한 sealed-secret.yaml을 통해 클러스터에 주입합니다.
#   db-password, s3-access-key-id, s3-secret-access-key
#   auth-secret-master-key, auth-admin-token
#   auth-root-access-key-id, auth-root-secret-key
# kubeseal 로 생성된 Secret 이 클러스터에 이미 존재하므로
# helm 은 Secret 생성을 건너뜁니다.
secrets:
  useExternalSecret: true

# ── 인증 설정 ─────────────────────────────────────────────────────────────────
auth:
  anonymousGet: true   # true이면 GET/HEAD /{bucket}/{key} 를 인증 없이 허용 (이미지 서버, FiftyOne 등)
  adminToken: true

# ── 서비스 ────────────────────────────────────────────────────────────────────
service:
  type: NodePort
  port: 80
  targetPort: 8080
  nodePort: 30080

# ── Ingress ───────────────────────────────────────────────────────────────────
ingress:
  enabled: false
  className: "nginx"
  annotations:
    # 대용량 파일 업로드 지원 (최대 10 GiB)
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
  host: cas.example.com
  tls: []

# ── 리소스 ────────────────────────────────────────────────────────────────────
# limits.memory 를 바꾸면 config.maxUploadBytesInFlight 도 같이 바꿀 것 (기준 0.5배).
# 한도만 올리고 예산을 그대로 두면 방어선이 실효 없이 낮게 남고, 한도만 내리면
# 예산이 한도를 넘어 상한이 걸리기 전에 OOMKilled 된다.

# 6Gi 는 2026-08-05 OOM 대응으로 올린 값이다. 이미지 0.1.16 배포 후 실환경에서
# 부하 1사이클을 돌려 유휴 구간 바닥값이 하락하는 것을 확인한 뒤
# 6Gi -> 3Gi -> 2Gi 로 단계적으로 내릴 것. config.maxUploadBytesInFlight 도 함께 내린다.
#
# 판정 쿼리:
#   min_over_time(container_memory_working_set_bytes{pod=~"cas-server.*"}[30m])
resources:
  requests:
    cpu: "500m"
    memory: "2Gi"
  limits:
    cpu: "2000m"
    memory: "6Gi"

terminationGracePeriodSeconds: 60

# ── 헬스체크 프로브 ───────────────────────────────────────────────────────────
# GET /_internal/health → DB ping + 백엔드 가용성 검사 (503 if degraded)
livenessProbe:
  httpGet:
    path: /_internal/health
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /_internal/health
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# ── 추가 환경변수 ─────────────────────────────────────────────────────────────
# 표준 CAS__ env var 형태로 추가 설정 주입 가능
extraEnv:
  - name: RUST_LOG
    value: "info"

# ── Pod 보안 컨텍스트 ─────────────────────────────────────────────────────────
podSecurityContext: {}

securityContext: {}

# ── 노드 스케줄링 ─────────────────────────────────────────────────────────────
nodeSelector: {}
tolerations: []
affinity: {}

# ── 서비스 어카운트 ───────────────────────────────────────────────────────────
serviceAccount:
  create: false
  name: ""

# ── GC CronJob ────────────────────────────────────────────────────────────────
# Pod 자체 GC(gcIntervalSecs=0)를 끄고 CronJob 한 대만 GC를 트리거.
# concurrencyPolicy: Forbid 로 GC Job이 겹쳐서 실행되지 않도록 보장.
gc:
  enabled: true
  # cron 표현식 — 매주 일요일 새벽 2시 : 0 2 * * 0 — 분 시 일 월 요일(0=일요일).
  schedule: "0 2 * * 0" 
  # Job이 이 시간(초) 안에 완료되지 않으면 강제 종료        
  activeDeadlineSeconds: 7200     # 블롭 많을 수 있으니 2시간으로 여유
  image:
    repository: curlimages/curl
    tag: "8.7.1"
    pullPolicy: IfNotPresent
