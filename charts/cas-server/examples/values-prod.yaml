# ─────────────────────────────────────────────────────────────────────────────
# cas-server 프로덕션 배포용 오버라이드 값
#
# 사용법:
#   helm install cas-server ./charts/cas-server -f examples/values-prod.yaml
#   helm upgrade  cas-server ./charts/cas-server -f examples/values-prod.yaml
# ─────────────────────────────────────────────────────────────────────────────

# ── 앱 설정 ───────────────────────────────────────────────────────────────────
config:
  # DB 커넥션 풀. 파드당 총 사용량은 dbMaxConnections + gcDbMaxConnections + 1(집계 전용).
  # 지켜야 할 부등식:
  #   replicaCount × (dbMaxConnections + gcDbMaxConnections + 1) < PostgreSQL max_connections
  # 아래 기본값 기준 1 × (20 + 2 + 1) = 23. 집계 전용 1개는 차트 0.1.24 에서 늘어난 몫이다.
  dbMaxConnections: 20

  # 업로드 상한(maxUploadBytesInFlight 3 GiB / maxConcurrentUploads 96)은
  # 차트 기본값에 이미 들어 있으므로 여기서 다시 쓸 필요가 없다.
  # 값을 바꿀 때는 values.yaml 의 주석(resources.limits.memory 와 0.5배로 연동)을 볼 것.

# ── S3 스토리지 ───────────────────────────────────────────────────────────────
storage:
  mode: "s3"
  s3:
    endpoint: ""      # 예: http://minio.example.com:9000
    bucket: ""        # 미리 생성된 버킷 이름
    region: ""        # S3 호환 스토리지는 임의값 가능. 예: "us-east-1"
    keyPrefix: "cas/" # 버킷 내 키 프리픽스 (다른 용도와 버킷을 공유할 경우 구분용)
    allowHttp: true   # HTTPS 사용 시 false로 변경

# ── PostgreSQL 접속 정보 ──────────────────────────────────────────────────────
externalDatabase:
  host: ""      # PostgreSQL 호스트
  port: 5432
  username: ""  # DB 사용자명
  database: ""  # DB 이름

# ── 자격증명 ─────────────────────────────────────────────────────────────────
# 필수 7개 + 선택 1개(auth-metrics-token)를 sealed-secret.yaml로 관리합니다.
# 이 파일에 포함하지 마세요.
# 적용 방법: kubectl apply -f sealed-secret.yaml (Helm 배포 전에 실행)
#
# auth-metrics-token 은 메트릭 읽기 전용 토큰입니다. 없어도 파드는 정상 기동하고
# 서버가 admin 토큰으로 폴백합니다. 모니터링 스택에는 admin 토큰이 아니라 이것을
# 쓰십시오 — admin 토큰은 blob 물리 삭제와 액세스 키 관리까지 여는 자격증명입니다.
# (cas-server 이미지 0.1.18 이상 필요)

# ── 리소스 ────────────────────────────────────────────────────────────────────
# 차트 기본값이 requests 2Gi / limits 6Gi 다. 그대로 쓰면 되므로 여기서 오버라이드하지 않는다.
#
# 6Gi 는 2026-08-05 OOM 대응으로 올린 값이고, **당분간 유지할 것.**
# 2026-08-11 실환경 관측에서 이미지 0.1.16 의 유휴 바닥값이 하루 330~430 MiB 씩
# 단조 상승했다. 하향(6Gi -> 3Gi -> 2Gi)은 그 상승이 멈춘 것을 최소 7일 확인한
# 뒤에만 한다. 전제 세 가지와 판정 쿼리는 차트 values.yaml 의 resources 주석 참고.
#
# 내릴 때는 config.maxUploadBytesInFlight 도 한도의 0.5배로 함께 내린다.


# ── GC CronJob ────────────────────────────────────────────────────────────────
# 초기 마이그레이션 중에는 false로 두고, 마이그레이션 완료 후 true로 활성화.
# GC는 orphaned blob만 삭제하므로 꺼둬도 데이터 손실 없음.
# 단, 장기간 꺼두면 삭제된 오브젝트의 S3 파일이 누적됨.
#
# 주의 (cas-server 이미지 0.1.17 **이하**): GC를 끄면 서버 내부의 해시별 쓰기 락
# 테이블 회수 경로도 함께 사라진다. 그 이미지에서 회수는 GC 실행 시에만 일어나므로,
# 끈 채로 대량 적재하면 고유 해시당 약 180~240바이트가 파드 수명 내내 쌓인다
# (2026-08 운영 사례: 유휴 바닥값이 하루 330~430 MiB 상승).
#
# 켜 두더라도 아래 schedule 이 곧 회수 주기다 — 주 1회면 최대 일주일치가 쌓인다.
# 대응 세 가지(이미지 0.1.18 이상으로 올리기 / 파드 재시작 / dry_run 주기 실행)의
# 판단 기준은 차트 README 의 "GC와 메모리 회수" 절 참고.
# 이미지 0.1.18 이상은 요청이 끝날 때 즉시 회수하므로 이 항목이 해당되지 않는다.
# 이 예시는 대량 이관을 전제로 GC 를 꺼 둔다(차트 기본값은 true).
# **이관이 끝나면 true 로 되돌릴 것** — 그 전까지 orphan blob 이 회수되지 않아
# 오브젝트 스토리지 사용량이 조용히 누적된다.
gc:
  enabled: false
  schedule: "0 2 * * 0"   # 활성화 시 실행 주기 (매주 일요일 02:00)
  activeDeadlineSeconds: 7200
