# nexus-client Helm Chart — values.yaml

image:
  repository: jiwonkim97/nexus-client
  tag: "0.1.13"
  # digest 로 핀하려면 여기에 넣으십시오 (`sha256:...`). 값이 있으면 tag 대신 이것이
  # 쓰이고, 렌더 결과가 `repository@sha256:...` 가 됩니다.
  #
  # 태그는 같은 이름으로 다시 밀릴 수 있어 "지금 무엇을 돌리고 있는가" 를 확정하지
  # 못합니다. digest 는 내용 주소라 그 문제가 없습니다. 각 버전의 digest 는 그 버전의
  # CHANGELOG 절 맨 위에 image 와 함께 적혀 있습니다.
  #
  # 비워 두면 지금까지와 같이 tag 로 참조합니다.
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
replicaCount: 1

nameOverride: ""
fullnameOverride: ""

# ── Caddy 프록시 대상 ─────────────────────────────────────────────────
backendUrl: "http://nexus-server:80"
# 이미지(CAS)를 same-origin 으로 프록시할 때만 설정(Caddyfile 의 /cas 블록도 함께 활성화).
# 보통 불필요 — 백엔드가 브라우저에서 닿는 CAS URL 을 반환하면 <img> 로 직접 로드된다.
casUrl: ""

# ── CAS SigV4 자격증명(선택) ──────────────────────────────────────────
# CAS 가 비익명(anonymousGet:false)이면, 사이드카가 CAS 이미지 GET 에 SigV4 서명을 붙이도록
# cas-console(Keys 탭)에서 발급한 GET 전용 정책 키를 주입한다.
# 비활성(기본)이면 사이드카는 무서명 GET → 익명 배포(anonymousGet:true)에서만 이미지가 로드된다.
# 서명은 사이드카→CAS 구간에서만 붙는다(브라우저는 키·서명·CAS 주소를 보지 못한다).
casAuth:
  enabled: false
  region: "cas-default"
  # CAS 키(CAS_ACCESS_KEY_ID·CAS_SECRET_ACCESS_KEY)를 담은 기존 Secret 이름.
  # sealed-secret 등으로 미리 만들어 이름만 참조한다. enabled=true 이면 필수.
  existingSecret: ""

service:
  type: NodePort
  port: 80
  targetPort: 80
  nodePort: 30070

ingress:
  enabled: false
  className: "nginx"
  annotations: {}
  host: nexus.example.com
  tls: []

resources:
  requests:
    cpu: "50m"
    memory: "64Mi"
  limits:
    cpu: "200m"
    memory: "128Mi"

terminationGracePeriodSeconds: 30

# Caddy 는 정적 서버라 '/' GET 으로 헬스 판단.
livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 5
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 3
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

extraEnv: []
podSecurityContext: {}
securityContext: {}
nodeSelector: {}
tolerations: []
affinity: {}
