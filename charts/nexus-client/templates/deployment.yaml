apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nexus-client.fullname" . }}
  labels:
    {{- include "nexus-client.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "nexus-client.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nexus-client.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
        - name: nexus-client
          {{- /*
            digest 가 있으면 그것으로 핀한다. 태그는 같은 이름으로 다시 밀릴 수 있어
            "지금 무엇을 돌리고 있는가" 를 확정하지 못한다. digest 는 내용 주소라
            그 문제가 없다. 값은 각 버전의 CHANGELOG 에 함께 싣는다.
          */}}
          image: "{{ .Values.image.repository }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ else }}:{{ .Values.image.tag }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          env:
            # Caddy listen 포트(= 컨테이너 포트)
            - name: PORT
              value: {{ .Values.service.targetPort | quote }}
            # Caddy 가 /api/* 를 프록시할 백엔드(클러스터 내부 nexus-server)
            - name: BACKEND_URL
              value: {{ .Values.backendUrl | quote }}
            {{- if .Values.casUrl }}
            - name: CAS_URL
              value: {{ .Values.casUrl | quote }}
            {{- end }}
            {{- if .Values.casAuth.enabled }}
            {{- $casSecret := required "casAuth.existingSecret 가 필요합니다 (casAuth.enabled=true)" .Values.casAuth.existingSecret }}
            # CAS 비익명 접근용 SigV4 자격증명 — 프록시 사이드카가 CAS 이미지 GET 서명에 사용한다.
            - name: CAS_REGION
              value: {{ .Values.casAuth.region | quote }}
            - name: CAS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ $casSecret }}
                  key: CAS_ACCESS_KEY_ID
            - name: CAS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $casSecret }}
                  key: CAS_SECRET_ACCESS_KEY
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
