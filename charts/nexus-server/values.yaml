# nexus-server Helm Chart — values.yaml
# 비밀(NEXUS__DATABASE__URL, NEXUS__CAS__KEY_ID/SECRET, NEXUS__JWT__SECRET,
#      NEXUS__CVAT__PASSWORD, NEXUS__AUTH__SUPERUSER_PASSWORD, NEXUS__METRICS__TOKEN)은
# 여기에 두지 않는다 — sealed-secret으로 클러스터에 주입하고 envFrom으로 받는다.
# 앞의 넷이 필수, 뒤의 셋은 그 기능을 쓸 때만이다(examples/secret.example.yaml).
#
# ── 문서 ─────────────────────────────────────────────────────────────────────
#   아키텍처 (도메인 모델·버전 관리·스냅샷 구조)
#     https://github.com/int2nexus/cas-server/blob/nexus-server-0.3.10/charts/nexus-server/docs/architecture.md
#   사용법 (설치·SDK 연결·Dataset 워크플로우)
#     https://github.com/int2nexus/cas-server/blob/nexus-server-0.3.10/charts/nexus-server/docs/usage.md
#   차트 README
#     https://github.com/int2nexus/cas-server/blob/nexus-server-0.3.10/charts/nexus-server/README.md
# ─────────────────────────────────────────────────────────────────────────────

image:
  repository: int2jieun/nexus-server
  tag: "0.1.14"
  # digest 로 핀하려면 여기에 넣으십시오 (`sha256:...`). 값이 있으면 tag 대신 이것이
  # 쓰이고, 렌더 결과가 `repository@sha256:...` 가 됩니다.
  #
  # 태그는 같은 이름으로 다시 밀릴 수 있어 "지금 무엇을 돌리고 있는가" 를 확정하지
  # 못합니다. digest 는 내용 주소라 그 문제가 없습니다. 각 버전의 digest 는 그 버전의
  # CHANGELOG 절 맨 위에 image 와 함께 적혀 있습니다.
  #
  # 비워 두면 지금까지와 같이 tag 로 참조합니다.
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

# 1보다 올려도 안전하다 — 코드로 확인했다(레플리카 2개 이상을 실제로 띄워 검증한 적은
# 없다, 아래는 코드 추론이다).
#
#   1. CVAT 세션 준비는 요청을 받은 프로세스 안에서 도는 background task다. 세션 행은
#      요청 처리 중 동기로 커밋되고, 느린 부분(CVAT project 생성·이미지 다운로드)만
#      background로 넘어간다. HTTP 요청은 정확히 하나의 레플리카로만 라우팅되므로 같은
#      세션이 두 번 준비되는 일은 일어날 수 없다.
#   2. 기동 시 각 레플리카가 방치된 creating 세션을 정리하는데(cvat.staleCreatingSecs
#      초과분), 이 UPDATE는 지금도 creating이고 기준을 넘은 행만 매칭하는 단일 조건문
#      이다. 먼저 실행한 레플리카의 트랜잭션이 커밋되면 그 행은 더 이상 creating이
#      아니므로 다음 레플리카가 같은 문장을 돌려도 매칭되는 행이 없다. 부수효과는 행
#      UPDATE뿐이고 CVAT 호출은 없다.
#
# 그래도 실제로 걸리는 조건이 둘 있다.
#
#   커넥션 산술: 레플리카마다 자기 풀을 새로 연다. replicaCount × database.maxConnections가
#   Postgres max_connections를 넘지 않아야 한다는 불변식은 이미 위 database 섹션에
#   있다 — 여기서 다시 계산하지 말고 그 값을 그대로 따를 것.
#
#   레플리카 2개 이상에서만 나오는 엣지 케이스: 기동 정리는 staleCreatingSecs를 넘은
#   creating 세션을 failed로 표시한다. 레플리카 1개면 이게 항상 맞다 — 재시작했다는
#   건 그 background task가 실제로 사라졌다는 뜻이기 때문이다. 레플리카가 여럿이면,
#   레플리카 B가 부팅하면서 레플리카 A가 **지금 실제로 준비 중인** 세션을 (그 준비가
#   staleCreatingSecs를 넘겨 오래 걸리고 있다면) failed로 잘못 표시할 수 있다. 결과는
#   잘못 failed된 세션과 로그 한 줄이지 데이터 손실이 아니다. 레플리카를 여럿 쓰고 CVAT
#   세션이 큰 경우 cvat.staleCreatingSecs를 실제 준비 시간보다 넉넉히 올릴 것.
replicaCount: 1

nameOverride: ""
fullnameOverride: ""

# ── 앱 설정 (비밀 외 env) ─────────────────────────────────────────────
server:
  port: 8090
  host: "0.0.0.0"

cas:
  baseUrl: "http://cas-server:80"   # 클러스터 내 cas-server 서비스
  region: "cas-default"
  defaultBucket: "data"

  #
  # cas 쪽에서 데이터 평면 키(Secret의 NEXUS__CAS__KEY_ID/SECRET)에 걸어야 할 정책:
  #   CreateBucket/PutObject/DeleteObject/GetObject. CreateBucket은 버킷이 이미 있어도
  #   필요하다 — 없으면 기동 시 기본 버킷 보장이 403으로 실패한다.
  #   annotations/·manifests/ 앞에 deny를 걸지 말 것 — seal이 이 키로 그 두 접두사에 직접 쓴다.
  #   **cas의 root 키를 쓰지 말 것**(root는 정책 평가를 건너뛰어 관리 평면 전권이다).
  #   서버는 이것을 확인하지 않는다.
  #
  # CAS 자격증명 자동 발급(cas.adminKeyId · cas.credentialsPerUser)은 차트 0.3.10에서 뺐다 —
  # 그 값을 적어도 렌더되지 않는다. CHANGELOG 0.3.10 참조.

# ── DB 풀 / ingest 동시성 ────────────────────────────────────────────
# 불변식: (동시에 적재하는 전원의 flush workers 합) × ingest.batchItemConcurrency
#         + 예약(4) ≤ database.maxConnections
#
#   **왼쪽 항은 한 사람이 아니라 그 순간 적재 중인 전원의 합이다.** 기본값(16/3)에서
#   workers 합계 상한은 4다. 5곳이 SDK 기본 workers=4로 동시에 적재하면 64로 상한의 4배.
#   appVersion 0.1.9부터 서버가 이것을 강제한다(아래 admissionWaitMs) — 넘긴 적재는
#   무한 대기 대신 429다. 즉 이 식은 처리량 기준이지 안전 기준이 아니다.
#
#   처리량을 더 원하면 둘을 함께 올릴 것(예: 40 / 8).
#   replicaCount>1이면 replicaCount × maxConnections 가 Postgres max_connections 이하여야 함.
database:
  # 적재가 쓸 수 있는 자리 = 이 값 - 4(조회·관리·seal 몫). readiness 전용 커넥션이 이
  # 풀 밖에 하나 더 붙으므로 Postgres 쪽 계산은 replica당 이 값 + 1.
  #
  # **내릴 때는 ingest.batchItemConcurrency와 함께 볼 것** — 자리가 배치 한 건의 비용보다
  # 작으면 부하 0에서도 /ingest/batch가 항상 429다. appVersion 0.1.9부터 그 조합은
  # **기동을 거부한다**(6 이하에서 걸린다).
  maxConnections: 16          # 항상 주입(어떤 이미지든 안전 — DB url은 secret에서 옴)
ingest:
  # 이미지 기본값이 3이라 보통 비워도 된다(그럼 env 미주입). override 하려면 이미지가
  # IngestConfig 전 필드 serde default 이상이어야 한다 — appVersion 0.0.3 이하에 주면
  # 역직렬화 실패로 기동이 깨진다.
  batchItemConcurrency: "3"
  # /ingest 와 /ingest/batch 가 자리를 기다리는 상한(ms). 그 안에 못 얻으면 대기가 아니라
  # 429 + Retry-After: 1. 비우면 서버 기본 3000. 0이면 기다리지 않는다 — 자리가 비어
  # 있으면 그대로 통과하고, 없으면 그 자리에서 429다.
  # 키우면 큰 배치가 잘릴 확률이 줄지만 상류 프록시 읽기 타임아웃(nexus-client nginx
  # 기본 60초)까지 붙잡혀 있는 시간도 는다. appVersion 0.1.9+.
  admissionWaitMs: ""

# ── 인증 ─────────────────────────────────────────────────────────────
# 세 값 모두 **비우면 이미지 기본값**(= 지금까지의 동작)이다. 아무것도 안 고쳐도 된다.
#
# 호환성: 셋 다 appVersion 0.1.3 이상에서만 동작한다. 구 이미지에 주입해도 기동이
#   깨지지는 않는다(모르는 설정 키는 무시된다) — 다만 아무 효과가 없다.
jwt:
  # 발급 토큰의 수명(시간). 비우면 서버 기본 24. 허용 범위 1~8760.
  #
  # 이 서버는 **토큰을 무효화할 수 없다**(AuthUser가 JWT를 디코드만 하고 DB를 보지 않는다).
  # 그래서 이 값이 곧 탈취·계정삭제·비밀번호변경의 노출 상한이다. 줄이면 상한이 줄지만
  # POST /api/v1/auth/refresh 호출이 잦아진다(refresh는 DB를 본다).
  # 범위를 벗어난 값을 주면 **기동이 실패한다**(DB 연결보다 먼저 검사한다).
  #
  # "설정 안 함"은 빈 문자열(`""`)뿐이다 — `0`을 포함해 그 외 값은 전부 그대로 env로
  # 주입된다. `0`은 범위(1~8760) 밖이라 서버가 기동에 실패한다 — 의도된 동작이다
  # (조용히 24로 되돌아가 "0을 줬는데 왜 24가 됐지"로 헤매는 쪽보다 낫다).
  ttlHours: ""

auth:
  # 공개 회원가입. false로 하면 POST /api/v1/auth/register 만 403이 되고
  # 로그인·갱신·기존 계정 동작은 그대로다. NodePort로 직접 노출된 배포에서
  # "망 안 누구나 계정을 만들 수 있는" 표면을 닫는 용도다.
  #
  # 끄기 전에 **필요한 사람 계정을 먼저 만들어 둘 것** — 끈 뒤에는 superuser도 사람
  # 계정을 새로 만들 수 없다(사람 계정을 만드는 API가 register 하나뿐이다).
  # 로봇 계정은 예외다 — `POST /api/v1/admin/robots`(appVersion 0.1.10+)는 이 값을
  # 보지 않으므로 가입을 닫은 뒤에도 관리자가 만들 수 있다. 적재용 자격증명은 이쪽으로
  # 낸다.
  registrationEnabled: true
  # 가입 승인 게이트. true로 하면 가입은 열려 있되 승인 전까지 아무것도 할 수 없다.
  #
  # 켜면 `POST /api/v1/auth/register`가 토큰 없이 202와 `{"status": "pending"}`을
  # 반환한다. 승인 전에는 로그인·토큰갱신이 403이다. 승인은
  # `POST /api/v1/admin/users/approve`, 대기 목록은 `GET /api/v1/admin/users/pending`
  # — 둘 다 관리자 전용이므로 auth.superuserEmail을 함께 설정해야 한다.
  #
  # 켜기 전에 가입한 계정은 영향받지 않는다.
  #
  # 주의: 켜면 가입 화면이 202를 처리해야 한다. nexus-client 쪽 대응이 먼저 필요하다.
  #
  # 호환성: appVersion 0.1.7 이상. 그 이전 이미지는 이 env를 무시한다.
  approvalRequired: false
  # 인증이 사용자 행(역할·승인 상태·활성 상태)을 읽고 캐시하는 시간(초). 기본 5.
  #
  # 권한 회수·계정 정지·계정 삭제가 듣기까지의 상한이다. 0이면 매 요청 조회로 즉시 반영되지만
  # 적재 부하에서 처리량이 20~33% 떨어진다(측정치, 인프라에 따라 다름). 조회 자체는
  # 끌 수 없다 — 이 키는 얼마나 자주 다시 읽는지만 조절한다.
  #
  # "설정 안 함"은 빈 문자열(`""`)뿐이다.
  #
  # 호환성: appVersion 0.1.7 이상. 그 이전 이미지는 이 env를 무시한다.
  revocationCacheTtlSecs: ""
  # OpenAPI 스펙(/api-docs/openapi.json)과 Swagger UI(/swagger-ui, /swagger-ui/).
  # false로 하면 세 경로가 **404**가 된다(403이 아니다).
  # 스펙 자체는 이미 전 경로에 인증이 걸려 있어 노출되는 것은 경로 목록뿐이다.
  docsEnabled: true
  # ── OIDC 발급자 (선택) ─────────────────────────────────────────────
  # 외부 IdP가 발급한 토큰을 그대로 인증 자격증명으로 받는 갈래를 연다.
  # **비어 있으면 기능이 꺼지고 기존 동작과 같다.**
  #
  # 항목마다:
  #   issuer    필수. 토큰의 iss와 같아야 하고 https:// 로 시작해야 한다
  #   audience  필수. 토큰 aud 안에 이 값이 있으면 통과한다(포함 검사).
  #             **aud가 없는 토큰은 거부한다.** azp는 보지 않는다.
  #             **비우면 서버가 기동에 실패한다** — 비운 채로 통과시키면 같은 발급자가
  #             낸 아무 토큰이나 받게 된다
  #   exchange  선택(기본 false). POST /api/v1/auth/oidc/exchange를 이 발급자에게 열지.
  #             워크로드가 자동으로 갈아 끼우는 토큰(쿠버네티스 SA 토큰)에는 켜지 말 것 —
  #             켜면 1시간짜리 토큰이 jwt.ttlHours짜리 nexus 토큰으로 바뀌어 자동 회전이
  #             사라진다
  #   jwksUri   선택. 없으면 {issuer}/.well-known/openid-configuration에서 찾는다.
  #             issuer와 JWKS 호스트가 다른 클러스터에서 필요하다. https:// 필수
  #   jwksAuth  선택. "serviceaccount" 하나만 받는다. JWKS를 조회할 때 파드 자신의
  #             ServiceAccount 토큰을 실어 보낸다 — 디스커버리·JWKS가 익명으로 403인
  #             쿠버네티스 클러스터에 필요하다.
  #             **serviceAccount.automountToken을 true로 함께 올려야 한다** — 기본값
  #             false에서는 토큰 파일이 없어 조회 요청이 나가지도 못하고, 그 발급자의
  #             토큰을 쓴 요청이 전부 실패한다. 기동은 성공한다(파일이 없어도 서버는
  #             뜬다). 응답은 전부 503("IdP 의 JWKS 를 가져오지 못했습니다")이고 로그에
  #             auth_error="jwks unavailable" 이 남는다(appVersion 0.1.12+. 0.1.11까지는
  #             조회를 시도한 요청만 503이고 이어지는 5초는 401이라 "토큰이 틀렸다"와
  #             구분되지 않았다). 판정은 서버 로그의 "JWKS 조회 실패" 줄에서 한다.
  #             같은 디렉터리의 ca.crt를 JWKS 조회의 TLS 신뢰에도 쓰므로, 클러스터
  #             자체 CA로 서명된 API 서버 인증서 뒤의 JWKS가 이 값으로 검증된다.
  #
  # 같은 issuer를 두 번 적으면 기동에 실패한다.
  #
  # **발급자만 설정하면 아무도 인증되지 않는다.** 신원은 관리자가 API로 등록한다
  # (POST /api/v1/admin/oidc-identities) — 자동 생성은 없다.
  #
  # 호환성: 이 차트가 요구하는 이미지 이상. 그 이전 이미지는 이 env를 무시하므로
  #   기동이 깨지지는 않지만 기능도 켜지지 않는다.
  oidc:
    issuers: []
    # 예:
    # issuers:
    #   - issuer: https://sso.example.com/realms/<realm>
    #     audience: <IdP 쪽에서 정한 값>
    #     exchange: true
    #   - issuer: https://kubernetes.default.svc.cluster.local
    #     audience: <파드 스펙의 projected 볼륨 audience와 같은 값>
    #     jwksUri: https://<API 서버>:6443/openid/v1/jwks
    #     jwksAuth: serviceaccount
  # ── superuser (선택) ───────────────────────────────────────────────
  # 설정으로 지정하는 관리 계정이다. **비우면 관리자를 만들 부트스트랩 수단이 없다** —
  # users.role = admin 은 마이그레이션이 백필하지 않으므로, 최초 한 명을 이 계정으로
  # 만들어야 한다. 한 명이라도 생긴 뒤에는 이 값을 비워도 그 계정들이 관리 권한을 유지한다.
  #
  # 관리 권한의 출처는 둘이다 — 이 설정 계정(재배포로 즉시 회수)과 users.role = admin
  # (운영 중 부여·회수, 캐시 수명만큼 늦게 듣는다).
  #
  # 켜려면 **두 곳을 함께** 채워야 한다 — 이메일은 여기, 비밀번호는 Secret의
  # NEXUS__AUTH__SUPERUSER_PASSWORD. **한쪽만 있으면 서버가 기동에 실패한다.** 일부러
  # 그렇게 만들었다: 운영자가 켰다고 믿는데 실제로는 꺼져 있는 상태가 가장 나쁘고, 그 사실이
  # 정작 필요한 순간(누군가 잠겼을 때)에야 드러나기 때문이다.
  #
  # **차트는 이 짝을 검사할 수 없다.** 비밀번호는 Secret에서 envFrom으로 들어오므로 템플릿에
  # 보이지 않는다. 그래서 `helm upgrade` 는 조용히 성공하고 **Pod가 CrashLoop로 드러난다** —
  # 로그에 어느 쪽이 빠졌는지 적힌다(`kubectl logs`).
  #
  # **끌 때도 두 곳을 함께 비운다.** 여기만 지우고 Secret에 비밀번호를 남겨두면 "비밀번호만
  # 있는" 상태가 되어 역시 기동에 실패한다. 권한 회수가 목적이라면 이메일을 지우고 Secret
  # 키도 함께 제거한 뒤 배포할 것.
  #
  # 계정은 기동 시 서버가 만든다(그래야 그 주소를 아무도 선점할 수 없다). **이미 있으면
  # 비밀번호를 덮지 않는다** — 운영자가 API로 바꾼 값이 파드 재시작마다 되돌아가면 안 되기
  # 때문이다. 즉 여기 적은 비밀번호는 **최초 생성 때만** 쓰인다. 나중에 이 값을 바꿔도
  # 로그인 비밀번호는 바뀌지 않는다(자주 나오는 오해다).
  #
  # 호환성: appVersion 0.1.3 이상이 필요하다. 그 이전 이미지는 이 env를 무시하므로 기동이
  #   깨지지는 않지만 기능도 켜지지 않는다 — 비워두면 어떤 이미지에서도 안전하다.
  superuserEmail: ""           # 예: "nexus-admin@example.com" — 비우면 기능 꺼짐
                               # 비밀번호는 Secret의 NEXUS__AUTH__SUPERUSER_PASSWORD (8자 이상)

# ── 메트릭 (선택, appVersion 0.1.9+) ─────────────────────────────────
# `GET /_internal/metrics` 가 Prometheus 텍스트를 낸다. **Secret의
# NEXUS__METRICS__TOKEN을 채우면 열리고, 비우면(기본) 그 경로는 404다.**
# values에 스위치가 없는 것은 이 차트가 Secret 전체를 envFrom으로 받기 때문이다 —
# 키를 넣는 것이 곧 켜는 것이고, 다른 비밀(JWT·CAS·CVAT)과 같은 경로다.
#
# 나머지 엔드포인트와 달리 JWT가 아니라 별도 bearer를 받는다 — 스크레이퍼는 로그인할 수
# 없고, JWT를 쓰게 하면 모니터링 스택이 카탈로그 전체를 읽는 계정을 들고 있어야 한다.
#
# 내는 지표 이름 열넷(appVersion 0.1.10부터 다섯, 0.1.12부터 하나가 늘었고, 차트 0.3.10의 이미지에서
# 하나가 빠지고 셋이 늘었다):
#   nexus_db_pool_connections            워크로드 풀의 현재 커넥션 수(상한이 아니다)
#   nexus_db_pool_idle_connections       그중 유휴. 현재 - 유휴 = 사용 중
#   nexus_db_pool_acquire_timeouts_total 풀 획득 타임아웃 누적 — 이 값이 오르기
#                                        시작하는 순간이 사고의 시작점이다
#   nexus_ingest_permits_total           적재 자리 수(maxConnections - 4)
#   nexus_ingest_permits_available       그중 비어 있는 자리
#   nexus_ingest_rejected_total          유입 제어가 429로 돌려보낸 누적 건수
#   nexus_robot_tokens_active            폐기되지 않았고 만료 전인 로봇 토큰 수
#   nexus_robot_tokens_expiring_soon     그중 7일 안에 만료되는 것
#   nexus_robot_token_min_expires_in_seconds  가장 가까운 만료까지 남은 초.
#                                        **활성 토큰이 없으면 +Inf** — 0을 내면 알림이
#                                        "임박"으로 읽고, 시리즈를 빼면 옛 값이 남는다
#   nexus_robot_accounts_without_active_token 활성 토큰이 하나도 없는 로봇 계정 수
#   nexus_metrics_db_stats_ok            DB를 읽는 로봇 넷을 이번 스크레이프에서
#                                        실제로 읽었으면 1, 못 읽었으면 0 (appVersion 0.1.12+)
#   axum_http_requests_total             요청 수. 라벨 method·status·endpoint
#   axum_http_requests_duration_seconds  요청 지연 히스토그램. 라벨 method·status·endpoint
#   axum_http_requests_pending           처리 중인 요청 수. 라벨 method·endpoint
#                                        (HTTP 셋은 차트 0.3.10의 이미지부터. 이름·라벨 키가
#                                        cas-server와 같다. endpoint는 라우트 템플릿이고,
#                                        어느 라우트에도 매칭되지 않은 요청은 unmatched다 —
#                                        cas-server는 그 자리에 요청 경로를 적는다)
#   nexus_cas_credential_revocations_pending은 차트 0.3.10의 이미지에서 없어졌다.
# readiness 전용 커넥션은 세지 않는다(크기 1 고정).
#
# **DB를 조회하는 것은 로봇 넷뿐이다**(한 왕복, 250ms 제한). **조회가 실패하거나 250ms를
# 넘겨도 그 넷은 사라지지 않고 직전 값으로 남는다**(기동 후 한 번도 못 읽었으면 처음부터
# 없다) — 그래서 넷을 읽는 알림은
# nexus_metrics_db_stats_ok == 1 을 함께 건다. 풀·유입 제어 지표는 메모리 상태라 그대로
# 나온다. readiness 전용
# 풀(크기 1)은 쓰지 않는다: 스크레이프가 그 하나를 잡으면 readiness가 굶어 파드가
# 서비스에서 빠지는데, 그것이 0.3.6에서 두 풀을 나눈 이유와 같은 모양의 사고다.
# 설정 여부는 `GET /api/v1/admin/config-effective` 의 `metrics.token_set` 으로 확인한다.

# ── CVAT 연동 (선택) ─────────────────────────────────────────────────
# annotation 편집 세션에 쓰는 외부 편집기. **설정하지 않으면 연동만 꺼지고 서버는 정상
# 동작한다** — annotation session 엔드포인트만 503을 반환하고 나머지 API는 영향이 없다.
#
# 켜려면 baseUrl과 user를 여기에, 비밀번호는 Secret에 NEXUS__CVAT__PASSWORD로 넣는다.
# 셋 중 하나라도 비면 서버가 미구성으로 판단하고(기동 로그에 무엇이 빠졌는지 남는다)
# 연동을 켜지 않는다.
#
# 호환성: CVAT 연동에는 appVersion 0.1.1 이상이 필요하다(그 이전 이미지는 cvat 설정을
#   모른다). 구 이미지에 NEXUS__CVAT__* env를 줘도 기동이 깨지지는 않는다 — 모르는 설정
#   섹션은 무시된다(실측 확인). 차트를 먼저 올리고 이미지를 나중에 올려도 안전하다.
#
# CVAT 쪽 준비(운영자 작업): 서비스 계정 생성, CVAT 워커에서 CAS 주소로 도달 가능,
#   smokescreen 사설대역 허용(SMOKESCREEN_OPTS=--allow-range=...). 자세한 내용은 usage.md.
cvat:
  baseUrl: ""                  # 예: "http://cvat.example.com:8080" — 비우면 연동 꺼짐
  user: ""                     # CVAT 서비스 계정(Django superuser)
  organization: ""             # CVAT organization slug (선택)
  projectNamePrefix: "nexus"   # CVAT project 이름 접두사 — 다른 프로젝트와 구분용
  segmentSize: ""              # job 분할 크기. 비우면 CVAT 기본 동작
  maxSessionSamples: ""        # 세션당 샘플 상한(서버 기본 2000)
  staleCreatingSecs: ""        # 준비 중 방치된 세션을 정리하는 기준(초, 서버 기본 1800)

# ── 비밀 Secret 참조 ─────────────────────────────────────────────────
# 이 Secret(아래 4키 보유)을 sealed-secret으로 미리 주입해야 한다:
#   NEXUS__DATABASE__URL, NEXUS__CAS__KEY_ID, NEXUS__CAS__SECRET, NEXUS__JWT__SECRET
# CVAT 연동을 쓰면 여기에 NEXUS__CVAT__PASSWORD도 함께 넣는다.
# superuser를 쓰면 NEXUS__AUTH__SUPERUSER_PASSWORD도 함께 넣는다(위 auth 참조).
# 메트릭을 쓰면 NEXUS__METRICS__TOKEN도 함께 넣는다 — 그 키를 넣는 것이 곧 켜는 것이다(위 metrics 참조).
# existingSecret 비우면 기본 이름(<fullname>) 사용.
secret:
  existingSecret: ""

service:
  type: NodePort
  port: 80
  # 컨테이너 포트 이름(deployment의 `name: http`)을 가리킨다 — 숫자가 아니라 이름이라
  # server.port를 바꾸면 자동으로 따라간다. 숫자로 바꾸면 server.port와 어긋날 수 있다.
  targetPort: http
  nodePort: 30090

ingress:
  enabled: false
  className: "nginx"
  annotations: {}
  host: nexus.example.com
  tls: []

# ── 리소스 ───────────────────────────────────────────────────────────────────
#
# **메모리 한도를 정하는 것은 seal 이다.** 적재·조회·CVAT 은 전부 요청 단위(한 배치,
# 한 페이지)라 데이터셋이 커져도 한 요청이 쓰는 양이 늘지 않는다. seal 만 **버전 하나를
# 통째로** 다룬다 — 그 버전의 샘플과 에셋 참조를 모아 manifest 한 덩어리로 직렬화해
# CAS 에 올린다. 그래서 필요한 한도는 "데이터 총량"이 아니라 **가장 큰 버전 하나**로 정해진다.
#
# 어림 계산. N = seal 할 버전 중 가장 큰 것의 샘플 수, A = 샘플 하나에 붙는 에셋 수(최소 1,
# 이미지만 올리면 1, depth·thermal 을 따로 등록하면 그만큼):
#
#     seal 피크  ≈  N × A × 1 KB
#     limits.memory  ≥  그 값 × 3
#
#   N = 10만,  A = 1  →  피크 약 0.1 GB  →  한도 0.5Gi 면 충분(기본 1Gi 안)
#   N = 50만,  A = 1  →  피크 약 0.5 GB  →  한도 2Gi
#   N = 100만, A = 1  →  피크 약 1.0 GB  →  한도 3Gi
#   N = 200만, A = 2  →  피크 약 4.0 GB  →  한도 12Gi
#
# 3 배로 잡는 이유가 셋이다. ⑴ CAS key 가 길면 그 문자열이 manifest 에 두 번(구조체와 JSON)
# 실려 1 KB 가정이 커진다 — 경로를 그대로 key 로 쓰면 100 자를 넘기 쉽다. ⑵ 피크가 짧게
# 스치는 값이 아니라 업로드가 끝날 때까지 유지된다. ⑶ 같은 파드가 그 시간에도 적재·조회를
# 받는다.
#
# **한 번 seal 한 파드의 RSS 는 피크에서 잘 안 내려온다**(할당자가 해제분을 OS 에 바로
# 돌려주지 않는다). 큰 seal 을 한 번만 돌릴 계획이어도 한도는 상시값으로 잡는 편이 맞다.
#
# 한도를 넘기면 그 파드가 OOMKill 된다. **카탈로그는 안전하다** — 버전을 sealed 로 바꾸는
# DB 쓰기가 맨 마지막이라 버전은 draft 로 남고, 재시도하면 이미 올라간 샤드는 내용 해시가
# 같아 건너뛴다. 다만 그 잔여 샤드는 GC 대상이 아니라 CAS 에 남는다.
#
# annotation 이 무거운 데이터셋(샘플당 키포인트·박스가 수십~수백)은 샤드 쪽에도 피크가
# 따로 있다 — 샤드 하나가 `annotationShardSize × 샘플당 annotation 크기`다. 위 식으로
# 잡은 한도에서 OOM 이 나면 이쪽을 의심하고, values 에 키가 없으므로 extraEnv 로 낮춘다:
#
#     extraEnv:
#       - name: NEXUS__INGEST__ANNOTATION_SHARD_SIZE
#         value: "1000"        # 기본 10000
#
# 샤드 크기를 바꾸면 샤드 경계가 달라져 **그 뒤에 seal 하는 버전의 샤드 객체가 달라진다**
# (이미 sealed 된 버전은 영향 없다). 값을 정했으면 이관 기간 동안 바꾸지 않는 편이 좋다.
#
# 자기 배포의 실제 값을 보려면 가장 큰 버전을 seal 하는 동안 파드의 RSS 를 관찰한다.
resources:
  requests:
    cpu: "250m"
    memory: "256Mi"
  limits:
    cpu: "1000m"
    memory: "1Gi"

terminationGracePeriodSeconds: 30

# ── 프로브 ───────────────────────────────────────────────────────────────────
# 셋으로 갈린다(appVersion 0.1.3 이상):
#
#   startupProbe   기동이 끝났는가.       GET /_internal/live
#                  성공할 때까지 liveness/readiness는 평가되지 않는다.
#   livenessProbe  프로세스가 먹통인가.    GET /_internal/live  (의존성을 조회하지 않음)
#   readinessProbe 지금 서빙 가능한가.     GET /_internal/health (DB ping)
#
# 호환성: /_internal/live 는 appVersion 0.1.3 이상에서만 제공된다. 위 image.tag 가 기본으로
#    그 이상을 가리키므로 평소에는 신경 쓸 것이 없다. 다만 image.tag 를 0.1.2 이하로 **덮어
#    쓰는 경우**에는 startupProbe.enabled 를 false 로 하고 livenessProbe.httpGet.path 를
#    /_internal/health 로 함께 되돌릴 것 — 그러지 않으면 404가 프로브 실패로 계산되어
#    파드가 Ready 에 이르지 못한 채 재시작을 반복한다.
#
# livenessProbe를 /_internal/health로 두면 안 된다. DB failover(보통 30~120초)에 파드가
# kill되는데, 재시작으로는 외부 의존성이 복구되지 않는다. 오히려 CrashLoopBackOff
# 백오프(최대 5분)가 붙어 중단이 원래 장애보다 길어진다. replicaCount가 1이면 그 시간이
# 곧 전면 중단이다.
#
# 프로브의 port는 **컨테이너 포트 이름**(`http`)이다. 숫자를 박으면 server.port를 바꿨을 때
# 따라오지 않아, 앱은 새 포트에서 도는데 kubelet은 옛 포트를 찔러 Pod가 영영 Ready가 되지
# 않는다 — 컨테이너 로그에는 아무 이상이 없어 원인을 찾기 어렵다.

# 기동 예산 = periodSeconds × failureThreshold = 10 × 60 = **600초**.
# 이 구간에는 포트 자체가 안 열려 있다(마이그레이션·superuser 부트스트랩이 bind보다 먼저
# 돈다). 그래서 프로브는 "200이 아닌 응답"이 아니라 connection refused를 받는다.
# 스키마를 바꾸는 릴리스에서 마이그레이션이 이 예산을 넘기면 kill → 재기동 →
# 마이그레이션 재시작이 반복된다. 실제 소요는 기동 로그의
# `마이그레이션 완료 applied=<건수> elapsed_ms=<소요>` 줄로 확인한다 — 단, elapsed_ms가
# 실제 스키마 작업 시간을 뜻하는 것은 applied가 0보다 큰 기동뿐이다(applied=0이면
# 마이그레이션은 이미 최신 상태였고 elapsed_ms는 그냥 확인에 걸린 시간이다).
# replicaCount: 1이면 이 판단이 그대로 맞는다. replicaCount > 1일 때는 applied가
# "이 프로세스의 마이그레이션 실행 동안 DB 전체에 걸린 델타"라서, sqlx의 advisory lock에
# 걸려 뒤에 도는 파드가 자신은 아무것도 적용하지 않았는데도 0이 아닌 applied를 보고할
# 수 있다 — 이 경우 그 파드의 elapsed_ms는 다른 파드의 마이그레이션이 끝나길 기다린
# 시간이지 자신이 스키마를 바꾼 시간이 아니다. 여유가 부족하면 failureThreshold를 올릴 것.
#
# 이미지 0.1.5의 마이그레이션에는 기존 samples를 한 번 훑는 백필이 있다(meta 필드 관측).
# 그 백필은 0.1.5로 처음 올라갈 때 한 번만 돌므로, 이미 0.1.5를 지나온 배포가 0.1.6으로
# 올라갈 때는 이 비용이 없다.
#
# **소요가 행 수에 선형이라는 것은 같은 하드웨어 안에서만 성립한다.** 계수는 환경마다
# 다르므로 다른 환경의 실측값을 행 수로 환산해 자기 예산으로 쓰면 안 된다. 같은
# 마이그레이션을 두 환경에서 잰 값이 이렇게 어긋난 적이 있다 — **행이 1.6배 많은 쪽이
# 오히려 4.5배 빨랐다.** 느린 쪽의 계수를 곱했으면 4배 넘게 과대평가했을 것이고, 반대
# 방향으로 어긋나는 환경도 당연히 있다. **예산은 넉넉한 쪽으로 잡는다** — 여유가 남으면 아무 일도
# 일어나지 않지만, 모자라면 kill → 재기동 → 마이그레이션 재시작이 반복된다. 자기 환경의
# 실제 소요는 첫 기동 로그의 `마이그레이션 완료 applied=<건수> elapsed_ms=<소요>` 중
# applied가 0보다 큰 줄에서 확인하고, 그 값을 다음 릴리스의 예산 근거로 삼을 것.
startupProbe:
  enabled: true
  httpGet:
    path: /_internal/live
    port: http
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 60

# initialDelaySeconds는 startupProbe가 켜져 있으면 사실상 의미가 없다(컨테이너 시작
# 시점부터 재는데, startupProbe 성공 시점에는 이미 경과해 있다). startupProbe를 끄는
# 경우를 대비해 남겨 둔다.
livenessProbe:
  httpGet:
    path: /_internal/live
    port: http
  initialDelaySeconds: 20
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

# readiness는 의존성을 본다. DB가 죽으면 Service 엔드포인트에서 빠지는 것이 맞는
# 동작이다 — 파드를 죽이지는 않으므로 DB가 돌아오면 그대로 복귀한다.
#
# **appVersion 0.1.9부터 크기 1의 전용 풀로 ping한다.** 적재가 워크로드 풀을 다 써도
# 200이므로, 이 프로브의 실패는 「DB에 못 닿는다」만 뜻한다(0.1.8 이하는 한 풀을 써서
# 적재 정체가 전면 중단으로 번졌다). 앱이 커넥션을 못 받고 있는지는 위 metrics 절의
# nexus_db_pool_acquire_timeouts_total 로 본다.
# 응답 본문은 성공 {"status":"ok","db":true}, 실패 {"status":"error","db":false}(503)이다
# (이미지 0.1.5부터 — 0.1.3 이하는 성공 {"status":"ok"} / 실패 {"error":"database unavailable"}).
# 프로브는 상태 코드만 읽으므로 이 본문은 사람이 curl로 확인할 때와, 본문을 직접 파싱하는
# 스크립트에만 의미가 있다.
readinessProbe:
  httpGet:
    path: /_internal/health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# DB가 뜨기 전에 기동하면 커넥션 풀 생성에서 즉시 실패해 CrashLoopBackOff에 빠진다.
# **기본값은 꺼짐**: 이 차트는 DB 주소를 Secret의 NEXUS__DATABASE__URL로만 받으므로,
# 여기 host/port를 적으면 같은 정보가 두 곳에 생겨 어긋날 수 있다. 켜는 쪽이 그 중복을
# 감수하겠다고 선택하는 구조다. startupProbe(600초)만으로도 대부분의 경우 충분하다.
#
# enabled: true인데 host를 비워두면 helm template 단계에서 바로 실패한다(빈 host로
# initContainer를 만들면 nc가 빈 주소에 무한 재시도하며 Pod가 원인 없이 Init에 멈춘다).
waitForPostgres:
  enabled: false
  host: ""          # 예: "postgres.db.svc.cluster.local" — enabled: true면 필수
  port: 5432
  image: busybox:1.36

extraEnv:
  - name: RUST_LOG
    value: "info"

podSecurityContext: {}
securityContext: {}
nodeSelector: {}
tolerations: []
affinity: {}
# 파드가 쓸 ServiceAccount. **`serviceAccount.create`/`serviceAccount.name`은 0.3.0부터
# 실제로 배선된다** — 그 전에는 이 블록이 있어도 템플릿이 참조하지 않아 설정해도 조용히
# 무시됐다.
#   create: true  → 차트가 만든다(이름은 name 또는 릴리스 fullname)
#   create: false → 이미 있는 것을 쓴다(name이 비면 "default")
# PodSecurity/NetworkPolicy를 ServiceAccount 기준으로 거는 배포에서는 이 값이 실제로
# 반영되는지가 중요하다.
serviceAccount:
  create: false
  name: ""
  annotations: {}
  # 기본값 false다. 마운트된 토큰은 컨테이너가 뚫렸을 때 그대로 API 접근 수단이 되고,
  # 보통은 파드 안에서 쿠버네티스 API를 부를 일이 없다.
  #
  # **auth.oidc.issuers에 jwksAuth: serviceaccount를 쓰면 true가 필요하다.** 그때는
  # 파드가 쿠버네티스 API의 JWKS를 부르고, 토큰과 ca.crt를 그 마운트에서 읽는다(조회
  # 때마다 다시 읽는다 — kubelet이 갈아 끼우기 때문이다).
  # false로 둔 채 켜면 기동은 성공하고 그 발급자의 토큰을 쓴 요청만 실패한다. 응답은
  # 전부 503("IdP 의 JWKS 를 가져오지 못했습니다")이다(appVersion 0.1.12+. 0.1.11까지는
  # 재조회를 시도한 요청만 503이고 그 뒤 5초 백오프 동안은 401이었다). 파일이 없다는
  # 사실은 응답에 나오지 않는다 — 서버 로그의 "JWKS 조회 실패"와
  # auth_error="jwks unavailable" 줄에서 본다.
  #
  # **`automountToken`은 0.3.1부터 이 값이 실제로 적용된다.** 그 전에는 templates/serviceaccount.yaml
  # 하나에만 렌더됐는데 그 파일은 create: true일 때만 만들어져, 기본값(create: false)
  # 설치에서는 이 키가 아무 효과가 없었다 — 파드는 네임스페이스의 default ServiceAccount를
  # 쓰고 그 토큰이 그대로 마운트됐다(문서와 반대). 이제 Deployment podSpec에도 직접
  # 렌더되어 create 여부와 무관하게 적용된다.
  automountToken: false
