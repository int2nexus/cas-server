apiVersion: v2
name: nexus-server
description: ML 학습 데이터 카탈로그 서버 (cas-server 위 Sample→Dataset 버전 관리)
type: application
version: 0.3.3
appVersion: "0.1.6"
# NOTE: ingest.batchItemConcurrency를 설정하려면 IngestConfig 전 필드 serde default가 든
# 새 이미지(> 0.0.3)가 필요하다. 그 전 이미지엔 database.maxConnections만 주입해도 안전.
# NOTE: cvat.baseUrl을 설정하려면 CvatConfig 전 필드 serde default가 든 새 이미지(0.1.1 이상)가
# 필요하다. 비워두면 CVAT env가 주입되지 않아 어떤 이미지에서도 안전하다.
# NOTE: auth.superuserEmail을 설정하려면 appVersion 0.1.3 이상이 필요하다. 구 이미지는 이 env를
# 무시하므로 기동은 되지만 기능이 켜지지 않는다. 비워두면 어떤 이미지에서도 안전하다.
# NOTE: startupProbe/livenessProbe가 기본으로 찌르는 /_internal/live는 appVersion 0.1.3에서
# 신설된 경로다. 이미지를 0.1.2 이하로 고정해 쓰면 이 경로가 404라 startupProbe가 절대
# 성공하지 못해 파드가 무한 재시작한다 — startupProbe.enabled=false와
# livenessProbe.httpGet.path=/_internal/health로 되돌릴 것.
