apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nexus-server.fullname" . }}
  labels:
    {{- include "nexus-server.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "nexus-server.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nexus-server.selectorLabels" . | nindent 8 }}
    spec:
      # values.yaml에 serviceAccount 블록이 있는데 템플릿이 참조하지 않아, 설정해도
      # 조용히 아무 일도 일어나지 않던 자리다(고객 리포트 N11). PodSecurity/NetworkPolicy를
      # ServiceAccount 기준으로 거는 배포에서는 "통제를 걸었다고 믿는데 안 걸린" 상태가 된다.
      serviceAccountName: {{ include "nexus-server.serviceAccountName" . }}
      # serviceAccount.create가 false면(기본값) templates/serviceaccount.yaml 자체가
      # 렌더되지 않아 그 안의 automountServiceAccountToken도 함께 사라진다 — create 여부와
      # 무관하게 값이 실제로 적용되려면 podSpec에도 명시적으로 렌더해야 한다. Pod의 이 필드가
      # 있으면 ServiceAccount 쪽 설정보다 항상 우선한다.
      automountServiceAccountToken: {{ .Values.serviceAccount.automountToken }}
      {{- if .Values.waitForPostgres.enabled }}
      {{- $pgHost := required "waitForPostgres.host가 비어 있다 — waitForPostgres.enabled=true면 반드시 지정할 것. DB 주소는 Secret의 NEXUS__DATABASE__URL로만 전달되어 이 차트는 host를 볼 수 없고, 비운 채로 두면 initContainer가 빈 주소에 대고 무한 재시도하며 Pod가 Init 단계에 원인 없이 멈춘다." .Values.waitForPostgres.host }}
      initContainers:
        # DB가 뜨기 전에 기동하면 커넥션 풀 생성에서 즉시 실패해 CrashLoopBackOff에 빠진다
        # (백오프가 최대 5분까지 늘어난다). 기본값은 **꺼짐** — 이 차트는 DB 주소를
        # Secret의 NEXUS__DATABASE__URL로만 받으므로, 여기 host/port를 적으면 같은 정보가
        # 두 곳에 생겨 어긋날 수 있다. 켜는 쪽이 그 중복을 감수하겠다고 선택하는 구조다.
        - name: wait-for-postgres
          image: {{ .Values.waitForPostgres.image }}
          command:
            - sh
            - -c
            - |
              echo "Waiting for PostgreSQL at {{ $pgHost }}:{{ .Values.waitForPostgres.port }}..."
              until nc -z {{ $pgHost }} {{ .Values.waitForPostgres.port }}; do
                echo "PostgreSQL not ready, retrying in 2s..."
                sleep 2
              done
              echo "PostgreSQL is ready."
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
        - name: nexus-server
          {{- /*
            digest 가 있으면 그것으로 핀한다. 태그는 같은 이름으로 다시 밀릴 수 있어
            "지금 무엇을 돌리고 있는가" 를 확정하지 못한다. digest 는 내용 주소라
            그 문제가 없다. 값은 각 버전의 CHANGELOG 에 함께 싣는다.
          */}}
          image: "{{ .Values.image.repository }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ else }}:{{ .Values.image.tag }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.server.port }}
              protocol: TCP
          env:
            - name: NEXUS__SERVER__PORT
              value: {{ .Values.server.port | quote }}
            - name: NEXUS__SERVER__HOST
              value: {{ .Values.server.host | quote }}
            - name: NEXUS__CAS__BASE_URL
              value: {{ .Values.cas.baseUrl | quote }}
            - name: NEXUS__CAS__REGION
              value: {{ .Values.cas.region | quote }}
            - name: NEXUS__CAS__DEFAULT_BUCKET
              value: {{ .Values.cas.defaultBucket | quote }}
            {{- if .Values.cas.adminKeyId }}
            {{- /* 비밀이 아니므로 평문 env로 둔다. 짝인 adminSecret은 Secret에서
                   envFrom으로 들어온다(cas.secret과 같은 경로) — 여기서는 보이지
                   않으므로 차트는 짝이 맞는지 검사할 수 없다. 한쪽만 있으면 서버가
                   기동에 실패한다(auth.superuserEmail과 같은 이유·같은 패턴). */}}
            - name: NEXUS__CAS__ADMIN_KEY_ID
              value: {{ .Values.cas.adminKeyId | quote }}
            {{- end }}
            {{- if ne (.Values.cas.credentialsPerUser | toString) "" }}
            - name: NEXUS__CAS__CREDENTIALS_PER_USER
              value: {{ .Values.cas.credentialsPerUser | quote }}
            {{- end }}
            - name: NEXUS__DATABASE__MAX_CONNECTIONS
              value: {{ .Values.database.maxConnections | quote }}
            {{- if ne (.Values.jwt.ttlHours | toString) "" }}
            {{- /* 빈 문자열("")만 "설정 안 함"이다 — Go template 진리값으로 판단하면 0도
                   false라 --set jwt.ttlHours=0 이 조용히 무시된다. 서버는 0을 범위 밖 값으로
                   보아 기동에 실패하는데(허용 범위 1~8760), 그게 의도된 동작이므로 0은
                   그대로 통과시켜 서버가 크게 실패하게 둔다. */}}
            - name: NEXUS__JWT__TTL_HOURS
              value: {{ .Values.jwt.ttlHours | quote }}
            {{- end }}
            {{- if not .Values.auth.registrationEnabled }}
            - name: NEXUS__AUTH__REGISTRATION_ENABLED
              value: "false"
            {{- end }}
            {{- if .Values.auth.approvalRequired }}
            - name: NEXUS__AUTH__APPROVAL_REQUIRED
              value: "true"
            {{- end }}
            {{- if ne (.Values.auth.revocationCacheTtlSecs | toString) "" }}
            {{- /* jwt.ttlHours 와 같은 이유로 진리값이 아니라 빈 문자열로 판단한다 —
                   0 은 "매 요청 조회"라는 유효한 설정이고, Go template 진리값으로 보면
                   그 값이 조용히 무시되어 기본 5초로 돌아간다. */}}
            - name: NEXUS__AUTH__REVOCATION_CACHE_TTL_SECS
              value: {{ .Values.auth.revocationCacheTtlSecs | quote }}
            {{- end }}
            {{- if not .Values.auth.docsEnabled }}
            - name: NEXUS__AUTH__DOCS_ENABLED
              value: "false"
            {{- end }}
            {{- with .Values.auth.oidc }}
            {{- if .issuers }}
            {{- /* 목록 전체를 JSON 배열 문자열로 한 키에 싣는다 — env 소스의 구분자가
                   "__"라 겹밑줄로 쪼갠 키(NEXUS__AUTH__OIDC__ISSUERS)는 서버가 모르는
                   경로가 되어 값이 조용히 들어가지 않고 기능이 꺼진 채로 뜬다.
                   비어 있으면 주입하지 않는다: 서버는 "없음"과 "빈 목록"을 같게 보고
                   기능을 끄므로, 넣지 않는 편이 이 키를 모르는 이미지에도 안전하다. */}}
            - name: NEXUS__AUTH__OIDC_ISSUERS
              value: {{ .issuers | toJson | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.ingest.batchItemConcurrency }}
            - name: NEXUS__INGEST__BATCH_ITEM_CONCURRENCY
              value: {{ .Values.ingest.batchItemConcurrency | quote }}
            {{- end }}
            {{- if ne (.Values.ingest.admissionWaitMs | toString) "" }}
            {{- /* 빈 문자열("")만 "설정 안 함"이다 — jwt.ttlHours와 같은 이유로 Go
                   template 진리값으로 판단하면 0도 false라 admissionWaitMs=0(자리가
                   없으면 즉시 429)이 조용히 무시된다. */}}
            - name: NEXUS__INGEST__ADMISSION_WAIT_MS
              value: {{ .Values.ingest.admissionWaitMs | quote }}
            {{- end }}
            {{- if .Values.cvat.baseUrl }}
            {{- /* baseUrl이 있을 때만 주입한다. 빈 값이라도 넣으면 cvat 섹션이 생겨,
                   CvatConfig에 serde default가 없는 구 이미지(≤ 0.1.0)가 기동에 실패한다. */}}
            - name: NEXUS__CVAT__BASE_URL
              value: {{ .Values.cvat.baseUrl | quote }}
            - name: NEXUS__CVAT__USER
              value: {{ .Values.cvat.user | quote }}
            {{- if .Values.cvat.organization }}
            - name: NEXUS__CVAT__ORGANIZATION
              value: {{ .Values.cvat.organization | quote }}
            {{- end }}
            {{- if .Values.cvat.projectNamePrefix }}
            - name: NEXUS__CVAT__PROJECT_NAME_PREFIX
              value: {{ .Values.cvat.projectNamePrefix | quote }}
            {{- end }}
            {{- if .Values.cvat.segmentSize }}
            - name: NEXUS__CVAT__SEGMENT_SIZE
              value: {{ .Values.cvat.segmentSize | quote }}
            {{- end }}
            {{- if .Values.cvat.maxSessionSamples }}
            - name: NEXUS__CVAT__MAX_SESSION_SAMPLES
              value: {{ .Values.cvat.maxSessionSamples | quote }}
            {{- end }}
            {{- if .Values.cvat.staleCreatingSecs }}
            - name: NEXUS__CVAT__STALE_CREATING_SECS
              value: {{ .Values.cvat.staleCreatingSecs | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.auth.superuserEmail }}
            {{- /* 이메일이 있을 때만 주입한다. 비밀번호는 Secret에서 envFrom으로 들어오므로
                   여기서는 보이지 않고, 따라서 **차트는 짝이 맞는지 검사할 수 없다** —
                   한쪽만 있으면 서버가 기동에 실패하고 Pod가 CrashLoop로 드러난다. */}}
            - name: NEXUS__AUTH__SUPERUSER_EMAIL
              value: {{ .Values.auth.superuserEmail | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ include "nexus-server.secretName" . }}
          {{- if .Values.startupProbe.enabled }}
          # 기동(마이그레이션·superuser 부트스트랩·CVAT 정리)이 끝날 때까지 liveness/readiness를
          # 유예한다. 이 구간에는 포트 자체가 안 열려 있어 프로브는 connection refused를 받는다.
          startupProbe:
            {{- toYaml (omit .Values.startupProbe "enabled") | nindent 12 }}
          {{- end }}
          # /_internal/live → 의존성을 조회하지 않는 프로세스 응답성 확인
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          # /_internal/health → DB ping
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
