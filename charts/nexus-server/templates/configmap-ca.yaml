{{- if .Values.caCerts }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nexus-server.fullname" . }}-ca
  labels:
    {{- include "nexus-server.labels" . | nindent 4 }}
data:
  {{- range $name, $pem := .Values.caCerts }}
  {{ $name | quote }}: |
    {{- $pem | nindent 4 }}
  {{- end }}
{{- end }}
