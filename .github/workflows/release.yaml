name: Release Charts

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      # values.yaml 에 선언됐는데 템플릿이 참조하지 않는 키를 잡는다.
      #
      # Helm 은 쓰이지 않는 값에 오류를 내지 않으므로, 이 부류의 결함은 "설정했는데
      # 조용히 무시되는" 형태로 나타나고 운영자는 고쳤다고 믿는다. 이 저장소에서
      # 넷을 이렇게 찾았다 — cas-server 의 config.requestTimeoutSecs 와
      # serviceAccount.*, nexus-server 의 serviceAccount.*,
      # 그리고 과거 cas-server 의 terminationGracePeriodSeconds.
      #
      # charts/ 아래 Chart.yaml 이 있는 디렉터리를 모두 검사한다. 차트를 추가할 때
      # 이 단계를 손댈 필요가 없다.
      - name: Check for declared-but-unrendered values keys
        run: |
          pip install --quiet pyyaml
          python scripts/check-unrendered-values.py

      # docs/ 는 Helm 릴리즈 Secret 1MB 한도 때문에 .helmignore 로 패키지에서 빠진다.
      # 그래서 패키지 안 README·values·NOTES 가 문서를 밖으로 링크하는데, 그 링크를
      # 릴리스 태그로 고정하면(nexus-server 0.3.3~) 릴리스마다 손으로 버전을 올려야 한다.
      # 안 올리면 손에 든 차트와 다른 시점의 문서가 열리고, 조용히 그렇게 된다.
      #
      # main 을 가리키는 링크는 오류로 보지 않는다 — 고정하지 않기로 한 차트가 있다.
      - name: Check doc links match Chart.yaml version
        run: python scripts/check-doc-links.py

      # cr 은 release-notes-file 을 패키징된 tgz 안에서 찾으므로 패키징 전에 만들어야 한다.
      - name: Extract release notes from CHANGELOG
        run: bash scripts/extract-release-notes.sh

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.6.0
        with:
          skip_existing: true
          config: .cr.yaml
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
